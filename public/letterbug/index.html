<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letterbug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0e12;--ink:#ece6da;--dim:#8b8679;--line:#2b2b31;--bug:#f0cf8a;--red:#ff6b4e;--chip:#17181d}
body.paper{--bg:#d3cfc5;--ink:#1d1c1a;--dim:#6c675d;--line:#b3ad9f;--bug:#151517;--red:#c84a36;--chip:#c9c4b8}
body.paper{background:radial-gradient(ellipse 120% 70% at 25% 0%,#ebe7de 0%,#d3cfc5 45%,#bcb7ab 100%) fixed}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.04em;min-height:100vh;display:flex;flex-direction:column;transition:background .4s,color .4s}
header{display:flex;align-items:baseline;gap:10px;padding:16px 18px 6px}
.brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;letter-spacing:0;font-weight:500}
.brand b{color:var(--red);font-weight:500}
.tag{color:var(--dim);margin-right:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.chip i{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:0;font-style:italic}
.chip span{color:var(--dim);margin-left:6px}
.chip.on{border-color:var(--ink)}
.chip.own{border-style:dashed}
.stagewrap{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 0}
@media (max-width:600px){.stagewrap{align-items:flex-start;padding-top:28px}.tag{display:none}}
#stage{display:block;width:100%;max-width:980px}
.status{text-align:center;color:var(--dim);min-height:18px;padding:0 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status em{font-style:normal;color:var(--red)}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:12px 14px 6px}
button.b{font:inherit;letter-spacing:.06em;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;transition:border-color .2s,background .2s}
button.b:hover{border-color:var(--ink)}
button.b.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.b.red{border-color:var(--red);color:var(--red)}
button.b:disabled{opacity:.3;cursor:default}
.stomach{text-align:center;padding:6px 18px 20px;color:var(--dim)}
.stomach span{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--ink);letter-spacing:.18em;margin-left:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.modal.on{display:flex}
.box{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:min(600px,100%);padding:16px;display:flex;flex-direction:column;gap:10px}
.box h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:24px;letter-spacing:0}
textarea{width:100%;min-height:230px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.4;resize:vertical;outline:none}
.note{color:var(--dim);line-height:1.6}
.row{display:flex;gap:6px;justify-content:flex-end}
</style>
</head>
<body class="paper">
<header>
  <div class="brand">letter<b>bug</b></div>
  <div class="tag">eats a poem, lays another · <a href="/" style="color:inherit">David Szauder</a></div>
  <button class="b" id="bTheme">night</button>
</header>
<div class="chips" id="chips"></div>
<div class="stagewrap"><canvas id="stage"></canvas></div>
<div class="status" id="status">&nbsp;</div>
<div class="controls">
  <button class="b" id="bReplay">↺ replay</button>
  <button class="b" id="bRandom">random</button>
  <button class="b on" id="bEndless">∞ endless</button>
  <button class="b" id="bTrace">trace</button>
  <button class="b" id="bSpeed">1×</button>
  <button class="b" id="bCopy">copy</button>
</div>
<div class="stomach" id="stomach">stomach<span>·</span></div>

<div class="modal" id="modal">
  <div class="box">
    <h2>Feed it your own poem</h2>
    <textarea id="ta" spellcheck="false"></textarea>
    <div class="note">English works best. Claude writes the poem the bug has to arrive at, then the bug rebuilds yours letter by letter.</div>
    <div class="row"><button class="b" id="bCancel">cancel</button><button class="b red" id="bFeed">feed the bug</button></div>
  </div>
</div>

<script>
// ---------- poems (all public domain) + hand-made first transformations ----------
const PRESETS=[
 {id:'tyger',title:'The Tyger',author:'William Blake',
  src:["Tyger Tyger, burning bright,","In the forests of the night;","What immortal hand or eye,","Could frame thy fearful symmetry?"],
  out:{title:'Paper Hymn',lines:["Paper, paper, burning white,","On the borders of the light;","Watch immortal ink run dry,","Words remain, the careful memory."]}},
 {id:'hope',title:'“Hope” is the thing with feathers',short:'Hope',author:'Emily Dickinson',
  src:["“Hope” is the thing with feathers -","That perches in the soul -","And sings the tune without the words -","And never stops - at all -"],
  out:{title:'Home',lines:["“Home” is the thing with fences -","That perches on the hill -","And sings the tone within the walls -","And never stays - at all -"]}},
 {id:'s18',title:'Sonnet 18',author:'William Shakespeare',
  src:["Shall I compare thee to a summer’s day?","Thou art more lovely and more temperate:","Rough winds do shake the darling buds of May,","And summer’s lease hath all too short a date;"],
  out:{title:'Winter’s Bay',lines:["Shall I compare thee to a winter’s bay?","Thou art more lonely and more desperate:","Rough tides do shake the darkling boats all day,","And winter’s lease hath all too long a wait;"]}},
 {id:'old',title:'When You Are Old',short:'When You Are Old',author:'W. B. Yeats',
  src:["When you are old and grey and full of sleep,","And nodding by the fire, take down this book,","And slowly read, and dream of the soft look","Your eyes had once, and of their shadows deep;"],
  out:{title:'Kettle',lines:["When you are hot and grey and full of steam,","And singing by the fire, take down this hook,","And slowly pour, and dream of the soft brook","Your waves had once, and of their meadows deep;"]}},
 {id:'wind',title:'Who Has Seen the Wind?',short:'The Wind',author:'Christina Rossetti',
  src:["Who has seen the wind?","Neither I nor you:","But when the leaves hang trembling,","The wind is passing through."],
  out:{title:'Who Sewed',lines:["Who has sewn the wing?","Neither I nor you:","But when the sleeves hang trembling,","The thread is passing through."]}}
];

// ---------- basics ----------
const $=id=>document.getElementById(id);
const stage=$('stage'),ctx=stage.getContext('2d');
const SERIF='"Cormorant Garamond", Georgia, serif',MONO='"DM Mono", ui-monospace, monospace';
let DPR=Math.min(2,window.devicePixelRatio||1),W=600,H=400,FS=28,LH=50,X0=40,TOPH=90;
const pal={};let dark=true;
function readPal(){const cs=getComputedStyle(document.body);for(const k of['bg','ink','dim','line','bug','red'])pal[k]=cs.getPropertyValue('--'+k).trim();dark=!document.body.classList.contains('paper');}
readPal();
const mctx=document.createElement('canvas').getContext('2d');const wc=new Map();
function wem(ch){if(!ch)return 0;let v=wc.get(ch);if(v==null){mctx.font='500 100px '+SERIF;v=mctx.measureText(ch).width/100;wc.set(ch,v);}return v;}
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

// ---------- alignment (edit distance, letters only move where they must) ----------
function align(a,b){
  const A=[...a],B=[...b],n=A.length,m=B.length;
  const cost=(x,y)=>x===y?0:(x.toLowerCase()===y.toLowerCase()?0.4:1);
  const D=[];for(let i=0;i<=n;i++){D.push(new Float32Array(m+1));D[i][0]=i;}
  for(let j=0;j<=m;j++)D[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j-1]+cost(A[i-1],B[j-1]),D[i-1][j]+1,D[i][j-1]+1);
  const out=[];let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&Math.abs(D[i][j]-(D[i-1][j-1]+cost(A[i-1],B[j-1])))<1e-4){out.push([A[i-1],B[j-1]]);i--;j--;continue;}
    if(i>0&&Math.abs(D[i][j]-(D[i-1][j]+1))<1e-4){out.push([A[i-1],null]);i--;continue;}
    out.push([null,B[j-1]]);j--;
  }
  return out.reverse();
}

// ---------- poem model ----------
let lines=[],srcTitle='',srcSub='',dstTitle='',dstSub='',titleMix=0;
function buildLines(src,dst){
  if(dst){const n=Math.max(src.length,dst.length);src=[...src];dst=[...dst];while(src.length<n)src.push('');while(dst.length<n)dst.push('');}
  lines=src.map((s,li)=>{
    const d=dst?dst[li]:undefined;
    if(!s.trim()&&(!d||!d.trim()))return{blank:true,slots:[],flash:0,y:0};
    const pairs=(d===undefined||d===null)?[...s].map(c=>[c,undefined]):align(s,d);
    let ex=0;
    const slots=pairs.map(([a,b])=>{const w=wem(a||'');const sl={a,b,cur:a||'',w,wt:w,sc:1,flash:0,gx:a?ex+w/2:null,org:undefined,pend:false};ex+=w;return sl;});
    slots.forEach(sl=>{if(sl.a&&sl.b!==undefined&&sl.a===sl.b)sl.org={li,ex:sl.gx,keep:true};});
    return{blank:false,slots,flash:0,y:0,done:false,left:0};
  });
  layout();
}
function lineEm(L,k){return L.slots.reduce((s,sl)=>s+wem(k==='a'?(sl.a||''):(sl.b===undefined?(sl.a||''):(sl.b||''))),0);}
function layout(){
  const cw=Math.min(stage.parentElement.clientWidth,980);
  let maxEm=4;for(const L of lines)if(!L.blank)maxEm=Math.max(maxEm,lineEm(L,'a'),lineEm(L,'b'));
  const margin=Math.max(20,cw*.07);
  FS=Math.max(13,Math.min(40,(cw-2*margin)/maxEm));
  LH=FS*1.62;TOPH=Math.max(70,FS*2.9);
  X0=Math.max(margin,(cw-maxEm*FS)/2);
  W=cw;H=Math.round(TOPH+lines.length*LH+FS*1.6);
  lines.forEach((L,i)=>L.y=TOPH+FS*.9+i*LH);
  stage.width=W*DPR;stage.height=H*DPR;stage.style.height=H+'px';stage.style.width=W+'px';
  lines.forEach(L=>{let x=X0;L.slots.forEach(sl=>{sl.x=x;x+=sl.w*FS;});});
}
function stepX(dt){const k=Math.min(1,dt*9);for(const L of lines){let x=X0;for(const sl of L.slots){sl.w+=(sl.wt-sl.w)*k;sl.x=x;x+=sl.w*FS;}}}
const cy=L=>L.y-FS*.3;

// ---------- the creature: a shaggy, long-legged sculpture-beast ----------
// black fur, matte coloured balls, pink tube-eyes, a coral ring-eye, black horns, claw-tipped antennae,
// a teal knitted rump, hooves, and a long trunk with a pink ball at its tip that sucks up letters.
// It mutates with what it eats: vowels a/e/i/y open new eyes, o/u knit more teal, consonants lengthen
// and multiply the legs, hard consonants grow horns, capitals stick new balls on its back,
// punctuation sprouts antennae. The eaten letters sit on its fur like polka dots. Too big → it bursts and starts again.
const bug={x:0,y:0,v:0,odo:0,pulses:[],eatP:0,hop:0,face:1,fs:1,lx:0,ly:0,vx:0,antic:4,px:0,py:0,pvx:0,pvy:0,shake:0,root:{x:0,y:0},trail:[]};
const G={age:0,eyes:0,legs:0,spikes:0,knit:0,ant:0,balls:[],mass:0,rs:0,eyeSeeds:[],blinks:[]};
const FUR=Array.from({length:120},()=>Math.random());
const COL={black:'#151517',fur:'#1f1f23',teal:'#3f8796',tealL:'#5aa3b1',yellow:'#e2a72a',pink:'#ec7180',blue:'#4f8197',coral:'#e8735f',orange:'#f2a33a',cream:'#f1e8d4',hoof:'#2a2420'};
const BALLC=[COL.yellow,COL.pink,COL.blue,COL.coral];
let RUNID=0,sparks=[];
function bugAt(x,y){bug.x=x;bug.y=y;bug.v=0;}
function trailPush(){}
const mouthOff=()=>0;
function rnd(){return Math.random();}
function steer(tx,ty,dt,spd){
  const dx=tx-bug.x,dy=ty-bug.y,d=Math.hypot(dx,dy);
  if(d>1){bug.lx+=(dx/d-bug.lx)*Math.min(1,dt*6);bug.ly+=(dy/d-bug.ly)*Math.min(1,dt*6);if(Math.abs(dx)>FS*.6)bug.face=dx>0?1:-1;}
  if(d<.5){bug.v*=.8;return d;}
  const want=spd*Math.min(1,Math.max(.15,d/(FS*1.2)));
  bug.v+=(want-bug.v)*Math.min(1,dt*7);
  const st=Math.min(bug.v*dt,d);bug.x+=dx/d*st;bug.y+=dy/d*st;bug.odo+=st;bug.vx=dx/d*bug.v;
  return d;
}
function geneEat(ch){
  G.age++;const c=ch.toLowerCase();
  if('aeiy'.includes(c))G.eyes=Math.min(1,G.eyes+.025);
  else if('ou'.includes(c))G.knit=Math.min(1,G.knit+.06);
  else if(/[a-z]/.test(c)){const hard=/[ktxzvwjqb]/.test(c);G.legs=Math.min(1,G.legs+(hard?.018:.009));if(hard)G.spikes=Math.min(1,G.spikes+.045);}
  else if(c.trim())G.ant=Math.min(1,G.ant+.2);
  if(ch!==c&&G.balls.length<5&&rnd()<.5)G.balls.push({u:rnd()*1.2-.6,s:rnd(),c:BALLC[(rnd()*4)|0],w:rnd()*7});
  bug.eatP=1;
  if(G.age>=150)burst();
}
function burst(){
  const c=bug.root;
  for(let i=0;i<46;i++){const a=rnd()*7,v=FS*(1.5+rnd()*4);sparks.push({x:c.x-bug.fs*G.rs,y:c.y-G.rs*.4,vx:Math.cos(a)*v,vy:Math.sin(a)*v-FS*1.5,t:0,tuft:true,rot:rnd()*7});}
  G.balls.forEach(b=>sparks.push({x:c.x,y:c.y-G.rs,vx:(rnd()-.5)*FS*6,vy:-FS*(2+rnd()*3),t:0,ball:b.c,r:G.rs*(.2+.1*b.s)}));
  G.age=0;G.mass*=.4;G.eyes=0;G.legs=0;G.spikes=0;G.knit=0;G.ant=0;G.balls=[];G.rs*=.6;
  setStatus('<em>burst!</em> · it shakes off everything and starts again');
}
function targetR(){return FS*(.55+.32*Math.min(1,G.age/150)+.16*Math.min(1,stomach.length/26)+.06*G.mass);}
function eyeCount(){return 2+Math.floor(G.eyes*4.99);}
function stepCreature(dt){
  if(!G.rs)G.rs=targetR();
  G.rs+=(targetR()-G.rs)*Math.min(1,dt*2.5);
  bug.fs+=(bug.face-bug.fs)*Math.min(1,dt*5);
  const mv=Math.min(1,bug.v/(FS*1.4));bug.hop=Math.abs(Math.sin(bug.odo/(FS*.9)*Math.PI))*FS*.08*mv;
  bug.eatP*=Math.pow(.05,dt);bug.shake*=Math.pow(.1,dt);
  const tx=bug.lx*.6-bug.vx/(FS*8),ty=bug.ly*.5;
  bug.pvx+=((tx-bug.px)*80-bug.pvx*7)*dt;bug.pvy+=((ty-bug.py)*80-bug.pvy*7)*dt;bug.px+=bug.pvx*dt;bug.py+=bug.pvy*dt;
  const n=eyeCount();while(G.eyeSeeds.length<n){G.eyeSeeds.push({a:rnd(),b:rnd(),s:.75+rnd()*.5,ring:G.eyeSeeds.length%2===0});G.blinks.push({t:rnd()*3,c:0});}
  G.blinks.forEach(b=>{b.t-=dt;if(b.t<0){b.c=.14;b.t=2+rnd()*4;}if(b.c>0)b.c-=dt;});
  bug.antic-=dt;
  if(bug.antic<0){bug.antic=5+rnd()*7;
    if(rnd()<.5||!stomach.length)bug.shake=1;
    else{const e=stomach[(rnd()*stomach.length)|0];sparks.push({x:bug.root.x-bug.fs*G.rs*.6,y:bug.root.y-G.rs*.9,vx:-bug.fs*FS*(1+rnd()),vy:-FS*3,t:0,ball:BALLC[(rnd()*4)|0],r:G.rs*.16,ch:e.ch});}}
  sparks.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=FS*7*dt;p.vx*=.985;if(p.rot!=null)p.rot+=dt*5;});sparks=sparks.filter(p=>p.t<1.8);
  for(let k=stomach.length-1;k>=0;k--){const e=stomach[k];e.age+=dt;
    if(e.age>50||stomach.length>48&&k===0){stomach.splice(k,1);G.mass=Math.min(1,G.mass+.025);updStomach();}}
}
function shadeBall(x,y,r,c){const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.35,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.28)');
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.fillStyle=g;ctx.fill();}
function furLine(x0,y0,x1,y1,w,k){ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();}
function drawCreature(t,alpha){
  const r=G.rs,fs=bug.fs,mv=Math.min(1,bug.v/(FS*1.4));
  const fat=Math.min(1,stomach.length/26),gA=Math.min(1,G.age/150);
  const rx=r*(1.15+.45*gA+.2*fat),ry=r*.72*(1+.12*fat),L=r*(1.05+1.7*G.legs);
  const gy=bug.y+FS*.42,cy=gy-L-ry*.5-bug.hop,cx=bug.x-fs*rx*.7;
  const tipCol=dark?'#77777e':'#3b3b41';
  ctx.save();ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';
  // ground shadow
  ctx.fillStyle=dark?'rgba(0,0,0,.4)':'rgba(40,32,24,.16)';ctx.beginPath();ctx.ellipse(cx,gy+r*.08,rx*1.25,r*.16,0,0,7);ctx.fill();
  // legs (back row first, slightly darker)
  const nl=2+Math.floor(G.legs*4.99),ph=bug.odo/(FS*1.1)*Math.PI;
  const legs=[];
  for(let i=0;i<nl;i++){const u=nl===1?0:i/(nl-1);legs.push({i,u,x:cx+fs*rx*(-.62+1.2*u),back:i%2===1});}
  const drawLeg=(lg,dim)=>{
    const sw=Math.sin(ph+lg.i*Math.PI*.85),lift=Math.max(0,sw)*r*.18*mv;
    const fx=lg.x+fs*sw*r*.35*mv+(lg.back?-fs*r*.12:0),fy=gy-lift,hx=lg.x,hy=cy+ry*.35;
    const teal=G.knit>.35&&(fs>0?lg.u<G.knit*.6:lg.u>1-G.knit*.6);
    const col=teal?(dim?'#2f6874':COL.teal):(dim?'#0c0c0e':COL.black);
    const kx=(hx+fx)/2-fs*r*.12,ky=(hy+fy)/2;
    ctx.strokeStyle=col;ctx.lineWidth=r*(teal?.34:.22);ctx.beginPath();ctx.moveTo(hx,hy);ctx.quadraticCurveTo(kx,ky,fx,fy-r*.12);ctx.stroke();
    if(!teal){ctx.strokeStyle=dim?'#1a1a1d':tipCol;for(let k=0;k<6;k++){const q=k/6,x=hx+(fx-hx)*q+(kx-(hx+fx)/2)*Math.sin(q*Math.PI),y=hy+(fy-hy)*q;const s=(FUR[(k*7+lg.i*13)%120]-.5)*2;furLine(x,y,x+s*r*.16,y+r*.05,1,k);}}
    // hoof with a fur tuft
    ctx.fillStyle=dim?'#1a1612':COL.hoof;ctx.beginPath();ctx.ellipse(fx+fs*r*.05,fy-r*.07,r*.2,r*.12,0,0,7);ctx.fill();
    ctx.strokeStyle=teal?COL.tealL:tipCol;for(let k=0;k<5;k++){const a=-Math.PI*(.15+.7*k/4);furLine(fx+Math.cos(a)*r*.15,fy-r*.14,fx+Math.cos(a)*r*.25,fy-r*.14+Math.sin(a)*r*.1,1);}
  };
  legs.filter(l=>l.back).forEach(l=>drawLeg(l,true));
  // horns along the back
  const nsp=Math.floor(G.spikes*7.99);
  for(let k=0;k<nsp;k++){const u=.12+.76*(k/(Math.max(1,nsp-1)||1)),x=cx+fs*rx*(.55-1.15*u),yy=cy-ry*Math.sqrt(Math.max(0,1-((x-cx)/rx)**2))*.95;
    const h=r*(.3+.25*FUR[k*5%120]),w=r*.13,lean=-fs*.35;
    ctx.fillStyle=COL.black;ctx.beginPath();ctx.moveTo(x-w,yy+r*.06);ctx.quadraticCurveTo(x+lean*h*.3,yy-h*.6,x+lean*h*.55,yy-h);ctx.quadraticCurveTo(x+w*.4,yy-h*.4,x+w,yy+r*.06);ctx.closePath();ctx.fill();
    ctx.strokeStyle=dark?'#55555c':'#44444a';ctx.lineWidth=.8;for(let j=1;j<4;j++){ctx.beginPath();ctx.moveTo(x-w*(1-j*.22),yy-h*j*.22);ctx.lineTo(x+w*(1-j*.22)+lean*h*j*.12,yy-h*j*.22);ctx.stroke();}}
  // antennae with claw tips
  const na=Math.floor(G.ant*3.99);
  for(let k=0;k<na;k++){const bx=cx+fs*rx*(.45-.18*k),by=cy-ry*.75,len=r*(1+.3*k),a=-Math.PI/2+fs*(.55-.22*k)+Math.sin(t*1.6+k)*.08;
    const ex=bx+Math.cos(a)*len,ey=by+Math.sin(a)*len;ctx.strokeStyle=COL.black;ctx.lineWidth=r*.07;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.lineWidth=r*.06;for(const d of[-.55,0,.55]){ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(a+d)*r*.2,ey+Math.sin(a+d)*r*.2);ctx.stroke();}

  for(let k=0;k<K*2;k++){const p=pts[k%K],a=p.a+(FUR[(k*3)%120]-.5)*.25,n=FUR[(k*11)%120];
    const inTeal=G.knit>.03&&(fs>0?p.x<cx-rx+2*rx*G.knit*.85:p.x>cx+rx-2*rx*G.knit*.85);
    const len=r*(.1+.18*n)*(1+sh*.8*Math.sin(t*40+k));const wv=Math.sin(t*2.5+k*.7)*.2+sh*Math.sin(t*30+k);

    let ex,ey,er;

    else{ex=cx+fs*rx*(.6-1.2*sd.a);ey=cy+ry*(-.4+.75*sd.b);er=r*.2*sd.s;}

// ---------- run / scan / idle ----------
let MODE='idle',SPEED=1,ops=[],opi=0,phase='move',phT=0,stomach=[],parts=[],rings=[],stats={eat:0,lay:0,rec:0};
let TRACE=false,traceA=0,result=null,prev=null,seed=null,runToken=0,doneT=0,RANDOM=false,ENDLESS=true,claudeOK=false,presetIdx=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeOps(){
  ops=[];
  lines.forEach((L,li)=>{L.left=0;if(L.blank)return;L.slots.forEach((s,si)=>{if(s.b===undefined||s.a===s.b)return;s.pend=true;L.left++;ops.push({li,si,type:s.a&&s.b?'sub':(s.a?'del':'ins')});});});
  if(RANDOM)shuffle(ops);
}
function reorder(){
  if(MODE!=='run')return;const from=opi+1,rest=ops.slice(from);
  if(RANDOM)shuffle(rest);else rest.sort((x,y)=>x.li-y.li||x.si-y.si);
  ops.splice(from,rest.length,...rest);
}
// src / dst = {lines,title,sub,author}
function startRun(src,dst){
  runToken++;
  srcTitle=src.title;srcSub=src.sub||'';dstTitle=dst.title||'Untitled';dstSub=dst.sub||'';titleMix=0;
  const had=lines.length>0;
  buildLines(src.lines,dst.lines);makeOps();
  RUNID++;opi=0;phase='move';phT=0;parts=[];stats={eat:0,lay:0,rec:0};
  if(!had||bug.y>H||bug.x>W){const f=lines.find(l=>!l.blank);bugAt(X0-FS*1.5,f?cy(f):H/2);}
  prev=src;result=dst;
  MODE='run';updStomach();setStatus('the bug is rewriting <em>'+esc(srcTitle)+'</em>'+(RANDOM?' · at random':''));syncButtons();
}
function next(){opi++;phase='move';phT=0;}
function opDone(op){const L=lines[op.li],sl=L.slots[op.si];sl.pend=false;L.left--;if(L.left<=0){L.flash=1;L.done=true;}}
function takeFromStomach(ch){
  let k=stomach.findIndex(s=>s.ch===ch);if(k<0)k=stomach.findIndex(s=>s.ch.toLowerCase()===ch.toLowerCase());
  if(k<0)return null;return stomach.splice(k,1)[0];
}
function updateRun(dt){
  const op=ops[opi];if(!op){MODE='done';doneT=0;finish();return;}
  const L=lines[op.li],sl=L.slots[op.si],tx=sl.x+sl.w*FS/2,ty=cy(L);
  phT+=dt*SPEED;
  if(phase==='move'){
    const d=steer(tx,ty-mouthOff(),dt,FS*6*SPEED);
    if(d<FS*.24){phT=0;if(op.type==='ins'){lay(op,L,sl);}else{phase='eat';eat(L,sl,op.li);}}
  }else if(phase==='eat'){
    if(phT>.26){if(op.type==='del'){sl.wt=0;sl.cur='';setStatus('ate <em>'+esc(sl.a)+'</em>');opDone(op);next();}else lay(op,L,sl);}
  }else if(phase==='lay'){
    sl.sc=Math.min(1,phT/.22);if(phT>.32){sl.sc=1;opDone(op);next();}
  }
}
function eat(L,sl,li){
  parts.push({ch:sl.cur,x:sl.x+sl.w*FS/2,y:L.y,t:0});
  stomach.push({ch:sl.cur,li,ex:sl.gx,run:RUNID,a:Math.random()*7,rr:.3+Math.random()*.7,o:Math.random()*2-1,age:0});geneEat(sl.cur);
  sl.sc=0;stats.eat++;bug.pulses.push(0);updStomach();
}
function lay(op,L,sl){
  phase='lay';phT=0;
  const got=takeFromStomach(sl.b);
  sl.org=got&&got.run===RUNID?{li:got.li,ex:got.ex}:null;if(got){stats.rec++;if(got.px!=null)parts.push({ch:sl.b,x:got.px,y:got.py,tx:sl.x+sl.w*FS/2,ty:L.y,t:0,out:true});}
  sl.cur=sl.b;sl.wt=wem(sl.b);sl.sc=0;sl.flash=1;stats.lay++;
  rings.push({x:sl.x+sl.w*FS/2,y:cy(L),t:0});
  const from=got?(got.run!==RUNID?' · from an earlier poem':got.li===lines.indexOf(L)?' · recycled':' · recycled from line '+(got.li+1)):' · new';
  setStatus((sl.a?'ate <em>'+esc(sl.a)+'</em> · ':'')+'laid <em>'+esc(sl.b)+'</em>'+from);
  updStomach();
}
function finish(){
  setStatus(`<em>${esc(dstTitle)}</em> · ${stats.eat} eaten · ${stats.lay} laid · ${stats.rec} recycled`+(ENDLESS?' · next poem soon':''));
  syncButtons();
}
const same=(a,b)=>a&&b&&a.filter(x=>x.trim()).join('\n')===b.filter(x=>x.trim()).join('\n');
// endless without Claude: walk through the built-in poems, always landing on something meaningful
function presetStep(){
  let p=PRESETS.find(q=>same(q.src,result.lines));
  if(p){activeId=p.id;renderChips();startRun(result,{lines:p.out.lines,title:p.out.title,sub:'letterbug, after '+p.author,author:p.author});return;}
  const i=PRESETS.findIndex(q=>same(q.out.lines,result.lines));
  presetIdx=((i>=0?i:presetIdx)+1)%PRESETS.length;p=PRESETS[presetIdx];
  startRun(result,{lines:p.src,title:p.title,sub:p.author,author:p.author});
}
function advance(){if(!result)return;if(claudeOK)askClaude(result,true);else presetStep();}

// scanning while Claude writes
let scanW=[],scanI=0,scanWait=0;
function setupScan(){scanW=[];lines.forEach((L,li)=>{if(L.blank)return;let s0=-1;L.slots.forEach((sl,si)=>{const sp=sl.cur===' ';if(!sp&&s0<0)s0=si;if(s0>=0&&(sp||si===L.slots.length-1)){scanW.push({li,s0,s1:sp?si-1:si});s0=-1;}});});scanI=0;scanWait=0;}
function updateScan(dt){
  if(!scanW.length)return;const w=scanW[scanI%scanW.length],L=lines[w.li],a=L.slots[w.s0],b=L.slots[w.s1];
  if(scanWait>0){scanWait-=dt;bug.v*=.85;if(scanWait<=0)scanI++;return;}
  const d=steer((a.x+b.x+b.w*FS)/2,cy(L)-mouthOff()-FS*.4,dt,FS*3.6);
  if(d<FS*.3){scanWait=.3;for(let i=w.s0;i<=w.s1;i++)L.slots[i].flash=.5;}
}
let idleT=null,idleWait=0;
function updateIdle(dt){
  if(idleWait>0){idleWait-=dt;bug.v*=.88;return;}
  if(!idleT){const nb=lines.filter(l=>!l.blank);if(nb.length&&Math.random()<.8){const L=nb[Math.random()*nb.length|0],sl=L.slots[Math.random()*L.slots.length|0];idleT={x:sl.x+sl.w*FS/2,y:cy(L)-mouthOff()};}else idleT={x:FS+Math.random()*(W-2*FS),y:TOPH*.6+Math.random()*(H-TOPH*.6-FS)};}
  if(steer(idleT.x,idleT.y,dt,FS*2.4)<FS*.4){idleT=null;idleWait=.7+Math.random()*1.8;}
}

// ---------- drawing ----------
function draw(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  // title
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  const tfs=Math.max(16,FS*.78),ty=TOPH*.48;
  const showDst=MODE==='done';titleMix+=((showDst?1:0)-titleMix)*.06;
  ctx.font='italic 500 '+tfs+'px '+SERIF;ctx.fillStyle=pal.ink;
  ctx.globalAlpha=1-titleMix;ctx.fillText(srcTitle,X0,ty);
  ctx.globalAlpha=titleMix;ctx.fillText(dstTitle,X0,ty);
  ctx.font='10px '+MONO;ctx.fillStyle=pal.dim;
  ctx.globalAlpha=1-titleMix;ctx.fillText(srcSub.toUpperCase(),X0,ty+tfs*.75);
  ctx.globalAlpha=titleMix;ctx.fillText(dstSub.toUpperCase(),X0,ty+tfs*.75);
  ctx.globalAlpha=1;

  // progress → which part is still "old"
  traceA+=((TRACE?1:0)-traceA)*.08;

  // trace layer: ghosts of the source + threads
  if(traceA>.01){
    ctx.font='500 '+FS+'px '+SERIF;ctx.textAlign='center';
    lines.forEach(L=>{if(L.blank)return;L.slots.forEach(sl=>{if(!sl.a)return;ctx.globalAlpha=traceA*.2;ctx.fillStyle=pal.dim;ctx.fillText(sl.a,X0+sl.gx*FS,L.y);});});
    lines.forEach(L=>{if(L.blank)return;const y1=cy(L);L.slots.forEach(sl=>{
      if(!sl.cur||sl.sc<.05||sl.org===undefined)return;
      const x1=sl.x+sl.w*FS/2;
      if(sl.org===null){ctx.globalAlpha=traceA*.7;ctx.strokeStyle=pal.red;ctx.lineWidth=.8;ctx.beginPath();ctx.arc(x1,y1-FS*.78,1.8,0,7);ctx.stroke();return;}
      const x0=X0+sl.org.ex*FS,y0=cy(lines[sl.org.li]);
      if(sl.org.keep){if(Math.abs(x1-x0)<FS*.25)return;ctx.globalAlpha=traceA*.22;ctx.strokeStyle=pal.ink;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(x0,y0+FS*.36);ctx.lineTo(x1,y1+FS*.36);ctx.stroke();return;}
      const dist=Math.hypot(x1-x0,y1-y0),mx=(x0+x1)/2,my=Math.min(y0,y1)-Math.max(FS*.7,dist*.28);
      ctx.globalAlpha=traceA*.5;ctx.strokeStyle=pal.red;ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo(mx,my,x1,y1);ctx.stroke();
      ctx.fillStyle=pal.red;ctx.beginPath();ctx.arc(x0,y0,1.7,0,7);ctx.fill();ctx.beginPath();ctx.arc(x1,y1,1.7,0,7);ctx.fill();
    });});
    // letters eaten and never used again
    if(MODE==='done'){ctx.fillStyle=pal.red;stomach.forEach(s=>{if(s.run!==RUNID||!lines[s.li])return;ctx.globalAlpha=traceA*.7;ctx.beginPath();ctx.arc(X0+s.ex*FS,cy(lines[s.li])+FS*.5,1.4,0,7);ctx.fill();});}
    ctx.globalAlpha=1;
  }

  // poem
  ctx.font='500 '+FS+'px '+SERIF;ctx.textAlign='center';
  lines.forEach((L,li)=>{
    if(L.blank)return;
    if(L.flash>.01){ctx.globalAlpha=L.flash*.5;ctx.fillStyle=pal.red;const lw=L.slots.reduce((s,x)=>s+x.w,0)*FS;ctx.fillRect(X0,L.y+FS*.22,lw*(1-L.flash*.3),1);}
    L.slots.forEach((sl,si)=>{
      if(!sl.cur||sl.cur===' '||sl.sc<.02)return;
      const old=MODE==='run'&&sl.pend;
      let a=old?.42:1;if(MODE==='scan')a=.42+sl.flash*.58;

      ctx.fillText(sl.cur,0,0);ctx.restore();
    });
  });
  ctx.globalAlpha=1;

  // eaten letters flying into the bug
  parts.forEach(p=>{const k=ease(Math.min(1,p.t));const ex=p.out?p.tx:bug.root.x,ey=p.out?p.ty:bug.root.y;const x=p.x+(ex-p.x)*k,y=p.y+(ey-p.y)*k-Math.sin(k*Math.PI)*FS*.5;
    const sc=p.out?.4+.6*k:1-k*.8;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.globalAlpha=p.out?(1-k)*.9:1-k*.6;ctx.fillStyle=pal.red;ctx.font='500 '+FS+'px '+SERIF;ctx.fillText(p.ch,0,0);ctx.restore();});
  rings.forEach(r=>{ctx.globalAlpha=(1-r.t)*.6;ctx.strokeStyle=pal.red;ctx.lineWidth=1;ctx.beginPath();ctx.arc(r.x,r.y,(r.small?FS*.04+r.t*FS*.25:FS*.15+r.t*FS*.55),0,7);ctx.stroke();});
  ctx.globalAlpha=1;

  drawCreature(t,1-traceA*.55);
}
function mix(c1,c2,k){const p=c=>{c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16));};const a=p(c1),b=p(c2);return'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')+')';}

function stepFx(dt){
  stepCreature(dt);
  parts.forEach(p=>p.t+=dt*3.6*SPEED);parts=parts.filter(p=>p.t<1);
  rings.forEach(r=>r.t+=dt*2.6*SPEED);rings=rings.filter(r=>r.t<1);
  lines.forEach(L=>{L.flash*=Math.pow(.25,dt);L.slots.forEach(s=>{s.flash*=Math.pow(MODE==='scan'?.08:.35,dt);if(MODE!=='run'&&s.sc<1&&s.cur)s.sc=Math.min(1,s.sc+dt*4);});});
}

let last=performance.now(),T=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  stepX(dt);
  if(MODE==='run')updateRun(dt);else if(MODE==='scan')updateScan(dt);else updateIdle(dt);
  if(MODE==='done'&&ENDLESS){doneT+=dt*Math.min(SPEED,2);if(doneT>5){doneT=-1e9;advance();}}
  trailPush();stepFx(dt);draw(T);

// ---------- Claude ----------
let sampleNS=null;
async function getSample(){if(sampleNS)return sampleNS;try{if(window.claude&&window.claude.use)sampleNS=await window.claude.use('sample');}catch(e){}return sampleNS;}
function prompt(src){
  return `You are a poet working under a letter-mutation constraint, in the spirit of Oulipo.

A small letter-eating bug crawls through the SOURCE poem below and turns it into a NEW poem by eating letters and laying down new ones, line by line, word by word. You write the poem it must arrive at.

SOURCE POEM (${src.length} lines):
${src.map((l,i)=>(i+1)+': '+l).join('\n')}

Rules:
1. Exactly ${src.length} lines. Line i of your poem replaces line i of the source.
2. Keep the number of words per line close to the source line (at most one more or one fewer).
3. Word by word, prefer words that look like a few-letter mutation of the source word in the same position: similar length, many shared letters in similar positions (night→light, fearful→careful, bright→white, forests→borders). Small function words may stay.
4. MEANING COMES FIRST. The new poem must be grammatical, coherent and genuinely good: its own image, its own subject, ideally a quiet turn at the end. It must not paraphrase or summarise the source, and it must be clearly different from any version you might be shown. When letter-similarity and sense conflict, choose sense.
5. Natural punctuation and capitalisation. English only.

Return only JSON, no commentary: {"title": "a short title", "lines": ["...", "..."]}`;
}
function parseJ(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');return JSON.parse(t.slice(a,b+1));}
async function askClaude(src,auto){
  const tok=++runToken,srcLines=src.lines;
  srcTitle=src.title;srcSub=src.sub||'';titleMix=0;
  buildLines(srcLines,undefined);
  const f=lines.find(l=>!l.blank);if(bug.y>H||bug.x>W)bugAt(X0-FS*1.5,f?cy(f):H/2);
  MODE='scan';setupScan();updStomach();syncButtons();
  setStatus('Claude is writing the new poem · the bug is reading');
  const s=await getSample();
  if(tok!==runToken)return;
  if(!s){if(auto){claudeOK=false;presetStep();return;}MODE='idle';setStatus('Claude isn’t reachable in this view — open the page on claude.ai');syncButtons();return;}
  const nb=srcLines.filter(l=>l.trim());
  try{
    let r;
    try{r=await s.json(prompt(nb),{modelTier:'complex'});}
    catch(e){if(e&&(e.code==='not_granted'||e.code==='rate_limited'))throw e;const x=await s(prompt(nb),{modelTier:'complex'});r=parseJ(x.text);}
    if(tok!==runToken)return;
    let out=(r&&Array.isArray(r.lines)?r.lines:[]).map(x=>String(x).trim()).filter(Boolean);
    if(!out.length)throw{message:'empty answer'};
    while(out.length<nb.length)out.push(nb[out.length]);out=out.slice(0,nb.length);
    let k=0;const dst=srcLines.map(l=>l.trim()?out[k++]:'');
    claudeOK=true;
    startRun(src,{lines:dst,title:(r.title||'Untitled').toString().slice(0,60),sub:'letterbug, after '+(src.author||'you'),author:src.author||''});
  }catch(e){
    if(tok!==runToken)return;
    if(auto||ENDLESS){if(e&&e.code==='not_granted')claudeOK=false;result=src;presetStep();return;}
    MODE='idle';syncButtons();
    setStatus(e&&e.code==='not_granted'?'Claude access was not granted':e&&e.code==='rate_limited'?'too many requests — try again in a moment':'something went wrong — try again');
  }
}

// ---------- UI ----------
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function setStatus(h){$('status').innerHTML=h;}
function updStomach(){const s=stomach.map(x=>x.ch).join('');$('stomach').innerHTML='stomach<span>'+(s?esc(s.slice(-40)):'·')+'</span>';}
function syncButtons(){
  const busy=MODE==='scan';
  $('bReplay').disabled=busy||!result;$('bCopy').disabled=MODE!=='done';
}
let activeId=null;
function renderChips(){
  const c=$('chips');c.innerHTML='';
  PRESETS.forEach(p=>{const b=document.createElement('button');b.className='chip'+(p.id===activeId?' on':'');b.innerHTML='<i>'+esc(p.short||p.title)+'</i><span>'+esc(p.author.split(' ').pop())+'</span>';b.onclick=()=>pick(p);c.appendChild(b);});
}
function pick(p){activeId=p.id;presetIdx=PRESETS.indexOf(p);renderChips();seed={lines:p.src,title:p.title,sub:p.author,author:p.author};startRun(seed,{lines:p.out.lines,title:p.out.title,sub:'letterbug, after '+p.author,author:p.author});}
function normalize(t){let a=t.replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+$/,'').replace(/\t/g,' '));const o=[];a.forEach(l=>{if(!l.trim()&&(!o.length||!o[o.length-1].trim()))return;o.push(l);});while(o.length&&!o[o.length-1].trim())o.pop();return o.slice(0,40);}
function openModal(){$('ta').value=seed?seed.lines.join('\n'):'';$('modal').classList.add('on');setTimeout(()=>$('ta').focus(),50);}
$('bCancel').onclick=()=>$('modal').classList.remove('on');
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('on');};
$('bFeed').onclick=()=>{const src=normalize($('ta').value);if(!src.some(l=>l.trim()))return;$('modal').classList.remove('on');activeId='own';renderChips();seed={lines:src,title:'Your poem',sub:'',author:''};askClaude(seed);};
$('bReplay').onclick=()=>{if(prev&&result)startRun(prev,result);};
$('bRandom').onclick=()=>{RANDOM=!RANDOM;$('bRandom').classList.toggle('on',RANDOM);reorder();};
$('bEndless').onclick=()=>{ENDLESS=!ENDLESS;$('bEndless').classList.toggle('on',ENDLESS);if(ENDLESS&&MODE==='done')doneT=3;};
$('bTrace').onclick=()=>{TRACE=!TRACE;$('bTrace').classList.toggle('on',TRACE);};
$('bSpeed').onclick=()=>{SPEED=SPEED===1?2:SPEED===2?4:1;$('bSpeed').textContent=SPEED+'×';};
$('bCopy').onclick=async()=>{if(!result)return;try{await navigator.clipboard.writeText(result.title+'\n\n'+result.lines.join('\n'));$('bCopy').textContent='copied';}catch(e){$('bCopy').textContent='copy failed';}setTimeout(()=>$('bCopy').textContent='copy',1400);};
$('bTheme').onclick=()=>{document.body.classList.toggle('paper');readPal();$('bTheme').textContent=dark?'day':'night';};
window.addEventListener('resize',()=>{layout();});

renderChips();
const fontsReady=Promise.race([Promise.all([document.fonts.load('500 40px "Cormorant Garamond"'),document.fonts.load('italic 500 40px "Cormorant Garamond"'),document.fonts.load('10px "DM Mono"')]),new Promise(r=>setTimeout(r,1800))]);
fontsReady.then(()=>{wc.clear();pick(PRESETS[0]);requestAnimationFrame(frame);});
</script>
</body>
