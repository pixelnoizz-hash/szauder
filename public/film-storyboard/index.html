rekmagasságú POV a fa ülőperem alatt.", "cut": "Balról gyors kerékzörgés érkezik.", "number": 166, "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "war-73", "section": "04 · Biciklis játszótér", "title": "A biciklisek elsuhannak", "action": "Két nyolcvanas évekbeli biciklis balról jobbra halad el közvetlenül a búvóhely előtt. Port és leveleket vernek fel; a játszótér háttere változatlan.", "camera": "Talajközeli POV a fa perem alatt.", "cut": "Az utolsó első kerék közel kerül és kitölti a látóteret.", "number": 167, "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "war-74", "section": "04 · Biciklis játszótér", "title": "A kerék visszahoz", "action": "A bicikli szabályos, kör alakú kereke az eredeti játszótér talaján fordul.", "camera": "Kerékközeli a már azonosított játszótéren.", "cut": "A forgó kerékről a következő világ érkező tárgyaira váltunk.", "number": 168, "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-PE01", "section": "05 · Peaceful Era", "title": "A fogaskerék", "action": "A biciklikerék köre egy régi fogaskerekévé válik.", "camera": "Az előző tengely helyén tartott extrém közeli.", "cut": "Hátrálva feltárjuk, melyik géphez tartozik.", "number": 169, "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-atvezetes-169a", "number": "169a", "section": "05 · Peaceful Era", "title": "A gép feltárul", "action": "A fogaskerék egy rugós meghajtókocsi része. A kocsi mellett szerelők dolgoznak.", "camera": "Lassú hátrálás a fogaskeréktől az udvar közös képéig.", "cut": "A géptől balra fordulunk a próbahely felé.", "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-PE02", "section": "05 · Peaceful Era", "title": "A próbatér", "action": "Balra a vezető és a segítő, mellettük a szerelő. Jobbra a közös hajtás és a két kezelő. A kábel még nincs csatlakoztatva.", "camera": "Totál · szemmagasság · kb. 35 mm", "cut": "A totál rögzíti a fő szereplők helyét. A páros szék a második jelenet tágabb PE07 totáljában kerül a próbaút előterébe.", "number": 170, "width": 1600, "height": 905, "image": "kepek/kepek-09.js"}, {"id": "peace-PE02a", "section": "05 · Peaceful Era", "title": "A hajtás súlya", "action": "Megismerjük a nagy fogazott dobot, a kerekeket és a még szabad csatlakozót.", "camera": "Alacsony háromnegyedes gépközeli · tengelymagasság", "cut": "A gép méretét és anyagát bemutató nézet; a háttér visszakapcsol a totálhoz. A kábel nyomvonalát a végleges jelenetmodell szerint kell rögzíteni.", "number": 171, "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-PE03", "section": "05 · Peaceful Era", "title": "Az elakadt mozdulat", "action": "A vezető kinyújtja a kezét. A támasz még behúzott állapotban marad; a szerelő megvizsgálja a hajtás csuklóját.", "camera": "Közös félközeli · kb. 50 mm · azonos tengelyoldal", "cut": "A hiba animációban egy sikertelen, apró mozdulattal válik világossá. A kép önmagában a várakozást mutatja.", "number": 172, "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-PE03a", "section": "05 · Peaceful Era", "title": "Ugyanaz a palotaudvar", "action": "A robot karja visszahúzva vár. Balra ugyanaz a palotafal, mögötte vízszintes kőkorlát és fák; a várakozó férfi balra, a szerelő jobbra marad.", "camera": "Közelebbi nézet a bal váll mellől, változatlan háttérrel.", "cut": "A robot újabb mozdulatát ugyanebben a térben követjük.", "number": 173, "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-PE04", "section": "05 · Peaceful Era", "title": "A javítás", "action": "A nyitott körházban a szerelő kiemeli a beszorult rugós reteszt a fogazott elem útjából. Fémkattanás, rövid csönd.", "camera": "Részletközeli · kb. 85 mm", "cut": "A részletben a fedél nyitott, a következő totálban zárt. Vágás előtt rövid fedélzáró mozdulat kell. A javított oldali hajtás és a túloldali támasz közötti áttételt később tisztázni kell.", "number": 174, "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-PE05", "section": "05 · Peaceful Era", "title": "Az első próba", "action": "A támasz kitolódott. A vezető rátámaszkodik, talpára helyezi a súlyát és elemelkedni próbál a padról. A szerelő figyeli és megtartja a gépet.", "camera": "Visszatérés a totálhoz · azonos kamerahely", "cut": "A kábel itt még leválasztott. Kézi próba, nem járás. Ezután a PE06 csatlakozó-közelije következik.", "number": 175, "width": 1600, "height": 901, "image": "kepek/kepek-09.js"}, {"id": "peace-PE06", "section": "05 · Peaceful Era", "title": "A közös hajtás bekötése", "action": "A szerelő a rugalmas tengely bordázott csatlakozóját a robot oldalsó alsó hajtásbemenetébe illeszti, majd elfordítja a zárógyűrűt.", "camera": "Csatlakozó-részlet · alsó hajtásház magassága · azonos tengelyoldal", "cut": "A kép a behelyezés pillanatát mutatja. Az animációban teljes illesztés és gyűrűzárás kell. A bemenet a javított csukló alatti, oldalsó hajtáságon található; az átadás ugyanazon belső áttételt mozgatja.", "number": 176, "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-PE07", "section": "05 · Peaceful Era", "title": "A közös próba", "action": "A vezető már áll a támasznál. A kezelő működteti a hajtást, a páros szék megmozdul. Látjuk, hogy mindkét szerkezet ugyanahhoz a hajtáshoz kapcsolódik.", "camera": "Tágabb totál · enyhén megemelt kamera · azonos tengelyoldal", "cut": "A függőleges kar kontúrját visszaállítottuk. A két hajtáság külön kapcsolja a robotot és a széket a jobb oldali géphez. A rövid próba alatt a szék mögött maradjon elegendő szabad tengelyhossz.", "number": 177, "width": 1600, "height": 901, "image": "kepek/kepek-09.js"}, {"id": "peace-PE08", "section": "05 · Peaceful Era", "title": "Elindul a közös ülés", "action": "A két sisakos nő elindul a rugós ülésen. A hajtókocsit hajlékony tengely kapcsolja hozzájuk.", "camera": "Alacsony oldalnézet, jobbra haladó mozgással.", "cut": "A lépő csizmák és a rugós lábtartók közelijére vágunk.", "number": 178, "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-atvezetes-178a", "number": "178a", "section": "05 · Peaceful Era", "title": "Csizmák és rugók", "action": "A csizmák a rugós lábtartókat nyomják, alattuk forognak a kerekek; a hajlékony tengely együtt mozog az üléssel.", "camera": "Mozgó lábközeli, azonos jobbra haladó iránnyal.", "cut": "A kamera emelkedni kezd, feltárul az udvar kijárata.", "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-atvezetes-178b", "number": "178b", "section": "05 · Peaceful Era", "title": "Az udvar kijárata", "action": "Fentről látjuk, hogy az ülés és meghajtója a nyitott kapuhoz tart. A szerviz balra marad, a kapun túl menet halad.", "camera": "Első magasabb, ferde udvari nézet.", "cut": "Tovább emelkedve követjük a kapun átforduló járművet.", "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-atvezetes-178c", "number": "178c", "section": "05 · Peaceful Era", "title": "Bekapcsolódunk a menetbe", "action": "A két nő és a kapcsolt hajtókocsi kiér a kapun, és a gépbemutató felvonulásába fordul. A járdákon sűrű közönség áll. Nem tudjuk, verseny ez vagy felvonulás; érdekes, de nyugtalan is egyben.", "camera": "Magas légi nézet, a kapu és a csatlakozás egy képen.", "cut": "Leereszkedünk a menet szintjére; ugyanazok a gépek haladnak tovább.", "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-F07", "section": "05 · Peaceful Era", "title": "Nyilvános gépbemutató", "action": "Különös szerkezetek vonulnak a közönség előtt. A két nő rugós ülése csatlakozott a menethez; egyelőre mindenki együtt halad.", "camera": "Utcai nagytotál a menet mellett.", "cut": "Részleteken át követjük a bemutatót; később két gép egymás mellé ér.", "number": 179, "width": 1600, "height": 900, "image": "kepek/kepek-09.js"}, {"id": "peace-C02", "section": "05 · Peaceful Era", "title": "P16 · külön lépések", "action": "A három szegecselt alak lépése kicsit elcsúszik egymáshoz képest.", "camera": "Alsó részlet · testhéj és cipő", "cut": "P16 új nagyított referencia. A lépés eltérését az animációban kell kibontani; három külön figura marad.", "number": 180, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-F08", "section": "05 · Peaceful Era", "title": "A gépek a fejünk fölé magasodnak", "action": "A háromfejű gépezet elhalad; mögötte a lépcsős jármű érkezik. A tömeg előrehajol, egy kabát és cipő takarja a kép szélét. A géplépések közé beleszól a lánctalpas kattogás.", "camera": "Alsó kamera · kövezetszint · ferde előtér", "cut": "P44 tágabb állat + P11. Pontosan három fej. A megemelt gépláb a lépés kulcspóza; a tényleges járás animációja még szükséges.", "number": 181, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-C01", "section": "05 · Peaceful Era", "title": "A tér szélén egy pár", "action": "A csőfejű alak és a takart társa összebújik. A menet mögöttük továbbhalad; rövid ideig másra figyelünk.", "camera": "Takart középtotál · fa és nézők között", "cut": "P18 formáiból új, csókot idéző gesztus. Az eredetin nincs csók; ez átalakított jelenet, nem előkerült eredeti kép.", "number": 182, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-C01a", "section": "05 · Peaceful Era", "title": "Egy gyors érintkezés", "action": "A cső és a szövet érintkezik, a kéz a kabátot fogja. Egy rövid ütem után visszatérünk a térhez.", "camera": "Ferde maszkközeli · arc nélkül", "cut": "C01 párja, ugyanaz a fa és ruházat. Rövid betét, nem új portré.", "number": 183, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-F09", "section": "05 · Peaceful Era", "title": "Egymás mellé érnek", "action": "A rugós ülés és a rivális kocsi azonos tempóban halad. A vezetők összenéznek, és próbálják tartani egymás ritmusát.", "camera": "Közös oldalnézet mindkét járművel.", "cut": "A közönség felfigyel rájuk; a bíró rövid megállási próbát készít elő.", "number": 184, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-F10", "section": "05 · Peaceful Era", "title": "Olvashatatlan néző", "action": "Az egyik karakter kúpos maszkja kissé balra billen. Nem látunk arckifejezést. A nézők vállai és kalapjai időnként eltakarják: egy pillanatra észrevett furcsa alak a tumultusban.", "camera": "Maszkközeli · a tömegen belül · előtéri takarás", "cut": "A közeli a P15 referencia maszkolt nézőjéhez tartozik, nem a fiatal férfihoz. A korábbi F10 emberarcát F10_v02 váltja. A maszk és a világ önmagában hordozza a reakciót; a billenés és a takaró tömeg mozgása még animációs feladat.", "number": 185, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-R01", "section": "05 · Peaceful Era", "title": "Megállási próba", "action": "A bemutató két résztvevője rövid próbát vállal: a jelre indulnak, majd a krétavonalnál kell megállniuk. A bíró felemeli a zászlót.", "camera": "Közös kép a két járműről, krétavonalról és bíróról.", "cut": "A zászló mozdulata indítja a két gépet.", "number": 186, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-R02", "section": "05 · Peaceful Era", "title": "Előny a másik sávban", "action": "A szegecselt kocsi egy kicsivel előrébb jár. A közös szék kereke kitölti az előteret; a különbséget a két tengely helyzete mutatja.", "camera": "Alsó kamera · kerékmagasság · takart előtér", "cut": "R01 alapján. A sebességkülönbség és az előzés mozgásban még kidolgozandó. Nincs közeli emberarc.", "number": 187, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-M01", "section": "05 · Peaceful Era", "title": "A szerelő közbeszól", "action": "A szerelő megérinti a kezelő vállát. A következő képben a kezelő elmozdítja a szabályozót.", "camera": "Váll fölötti középtotál · háttal álló alakok", "cut": "R01 és R03. A szándékot a vállérintés és a következő mozdulat együtt adja; nincs fedetlen arc.", "number": 188, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-R03", "section": "05 · Peaceful Era", "title": "Többet a géptől", "action": "A kezelő előretolja a szabályozót. Az addigi puha kattogás sűrűbb, egyenletesebb ütemmé válik.", "camera": "Ferde szerkezetközeli · kéz és szabályozó", "cut": "A köztes gesztus és segítség most M01 / M03 képen szerepel. A gép méretét és tengelyhosszát a végleges mozgás előtt egyeztetjük.", "number": 189, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-M02", "section": "05 · Peaceful Era", "title": "A szék felzárkózik", "action": "A szék közelebb ér a másik kocsihoz. A két külön szerkezetet közös képben látjuk.", "camera": "Oldalirányú követő kép · nézők fölött", "cut": "R01 gépei. A felzárkózás kulcsképe; a teljes helycsere és előzés mozgásban készül. Tömör és lyukasztott kerék külön marad.", "number": 190, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-atvezetes-190a", "number": "190a", "section": "05 · Peaceful Era", "title": "A versenyző figyel", "action": "Az első nő a rivális felé fordítja sisakos fejét, és erősebben markolja az ülés szélét. A másik nő mögötte követi a mozdulatot.", "camera": "Arc- és kézközeli a haladó ülés mellett.", "cut": "A szorító kéz mozdulatáról a fékkar lehúzására vágunk.", "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-R04", "section": "05 · Peaceful Era", "title": "A fék nem elég", "action": "A használó meghúzza a féket, a kerék azonban még forog. A féksúrlódás hangja és a hajtás kattogása egymás ellen dolgozik.", "camera": "Alsó ferde részlet · fékkar és tömör kerék", "cut": "R02 szék. A kézi fék új elem; a további képekben ugyanezen az oldalon és helyen kell maradnia. A kerék elmosódása kulcspóz, nem kész mozgás.", "number": 191, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-R05", "section": "05 · Peaceful Era", "title": "Túl a megállási vonalon", "action": "A kocsi a jelölésnél áll. A közös szék továbbment. A bíró leengedi a zászlót, a tömeg hátrébb húzódik; ebből csalási probléma lett.", "camera": "Over the shoulder · kúpos maszk fölött · emelt nézőpont", "cut": "R01 + F09 nézőpont. Ugyanaz a balról jobbra irány és két külön sáv. A szék fejfedőjének formája ezen a vázlaton kissé merevebb; véglegesítéskor az eredeti szövött csuklyát kell visszaegyeztetni.", "number": 192, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-atvezetes-192a", "number": "192a", "section": "05 · Peaceful Era", "title": "A menet utoléri őket", "action": "A túlfutott ülés megáll, a bíró leengedi a zászlót. A szomszédos sávban megérkezik a felvonulás háromfejű gépállata, és a veszteglő ülés felé néz.", "camera": "Ferde közös kép: ülés és hajtókocsi elöl, külön sávban a háromfejű gép.", "cut": "A három fej tekintetét követve közelítünk a gépállatra.", "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-C03", "section": "05 · Peaceful Era", "title": "Három kíváncsi fej", "action": "A menet gépállatának három feje eltérő ütemben a megállt ülés felé fordul. A felvonulás mögötte továbbhalad.", "camera": "A már megismert gépállat közeli nézete.", "cut": "Tekintetirányból visszavágunk az ülésnél segítő riválisra.", "number": 193, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-M03", "section": "05 · Peaceful Era", "title": "A versenytárs odalép", "action": "A másik kocsi sötét kabátos használója odalép a székhez, és a váz felé nyúl.", "camera": "Alacsony váll fölötti kép · a szék mellől", "cut": "R07 szereplői. A tengely a képen kívül marad, a segítséget a kéz és a lépés mutatja.", "number": 194, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-atvezetes-194a", "number": "194a", "section": "05 · Peaceful Era", "title": "A rivális segít", "action": "A rivális lehajol a rugós ülés csatlakozásához, és kesztyűs kézzel megtartja a tengelyt. A nő figyeli.", "camera": "Sisakos arc és segítő kéz közeli, az ülés szélénél.", "cut": "A megtartott csatlakozóról a leválasztás teljes mozdulatára vágunk.", "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-R06", "section": "05 · Peaceful Era", "title": "A hajtást elengedik", "action": "A szerelő és a kezelő széthúzza a tengelykapcsolót. Látható rés nyílik a két fél között. A hajtókocsi még kattoghat, a szék már külön lassul és megáll.", "camera": "Alacsony szerkezetközeli · két kéz, két tengelyfél", "cut": "A köztes gesztus és segítség most M01 / M03 képen szerepel. A gép méretét és tengelyhosszát a végleges mozgás előtt egyeztetjük.", "number": 195, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-atvezetes-195a", "number": "195a", "section": "05 · Peaceful Era", "title": "A közönség visszatartja a lélegzetét", "action": "A kötél mögött egy nő összekulcsolja a kezét, mellette a férfi előrehajol. Mögöttük a szerelők még a tengelyt bontják.", "camera": "Két néző arcközelije; háttérben ugyanaz a művelet.", "cut": "A nézők tekintetét követve visszatérünk a leválasztott tengelyhez és álló kerékhez.", "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-M04", "section": "05 · Peaceful Era", "title": "A kerék megállt", "action": "A kerék már nem forog. A használó lazít a féken; a kettéválasztott tengely között rés marad. Egy pillanatnyi csend engedi megérkezni a feloldást.", "camera": "Alsó kerékrészlet · éles perem", "cut": "R06 után, R04 fékje. Éles álló perem a korábbi forgásnyom után; a tényleges lassulás animációs feladat.", "number": 196, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-R07", "section": "05 · Peaceful Era", "title": "A próba véget ér", "action": "A járművek állnak, a meghajtás leválasztva. A bíró elteszi a zászlót, a felvonulás folytatódik mellettük.", "camera": "Közös utcakép az álló résztvevőkkel.", "cut": "Az ülés egyik álló, tömör tárcsakerekére közelítünk.", "number": 197, "width": 1600, "height": 900, "image": "kepek/kepek-10.js"}, {"id": "peace-atvezetes-197a", "number": "197a", "section": "05 · Peaceful Era", "title": "Az álló kerék", "action": "A tömör fém tárcsakerék és tengelye kitölti a látóteret. A karcolások mozdulatlanok.", "camera": "Extrém kerékközeli, középen tartott tengellyel.", "cut": "A kör alakját megtartó vágás után már színes homok látszik alatta.", "width": 1600, "height": 900, "image": "kepek/kepek-11.js"}, {"id": "peace-atvezetes-197b", "number": "197b", "section": "05 · Peaceful Era", "title": "Ugyanaz a kör a homokban", "action": "A színessé vált kerékből hátrálva a homokozóban álló gép bontakozik ki. Fent megjelenik a búvóhely fa pereme, jobbra a háromfejű állat.", "camera": "Talajközeli POV, folyamatos hátrálás a keréktől.", "cut": "Tovább tágul a kép a két teljes gép és az ismert játszótér felé.", "width": 1600, "height": 900, "image": "kepek/kepek-11.js"}, {"id": "homok-H01", "section": "06 · Vissza a játszótérre, felnézés", "title": "Óriási gépek a jelenben", "action": "A búvóhelyről nézzük a homokozóban magukban dolgozó óriási gépeket.", "camera": "Alacsony szubjektív a homokozó pereme alól.", "cut": "A porladás következő állapota.", "number": 198, "width": 1600, "height": 905, "image": "kepek/kepek-11.js"}, {"id": "homok-H02", "section": "06 · Vissza a játszótérre, felnézés", "title": "Az első homokszemek", "action": "A gépek felületéről leválnak az első homokszemek.", "camera": "Alacsony szubjektív a homokozó pereme alól.", "cut": "A porladás következő állapota.", "number": 199, "width": 1600, "height": 905, "image": "kepek/kepek-11.js"}, {"id": "homok-H03", "section": "06 · Vissza a játszótérre, felnézés", "title": "A tartó láb elvékonyodik", "action": "A mechanikus működés folytatódik, miközben a szerkezetek anyaga porlad.", "camera": "Alacsony szubjektív a homokozó pereme alól.", "cut": "A porladás következő állapota.", "number": 200, "width": 1600, "height": 905, "image": "kepek/kepek-11.js"}, {"id": "homok-H04", "section": "06 · Vissza a játszótérre, felnézés", "title": "A gépek átengedik a fényt", "action": "Másik alacsony nézetből követjük a gépek szétesését.", "camera": "Alacsony szubjektív a homokozó pereme alól.", "cut": "A porladás következő állapota.", "number": 201, "width": 1600, "height": 905, "image": "kepek/kepek-11.js"}, {"id": "homok-H05", "section": "06 · Vissza a játszótérre, felnézés", "title": "Az utolsó gépív", "action": "A gépek maradványai homokká válnak; a hely kiürül.", "camera": "Alacsony szubjektív a homokozó pereme alól.", "cut": "A porladás következő állapota.", "number": 202, "width": 1600, "height": 905, "image": "kepek/kepek-11.js"}, {"id": "homok-H06", "section": "06 · Vissza a játszótérre, felnézés", "title": "Üres homok, megérkező nap", "action": "A csendes homokozó után lassan felfelé fordulunk.", "camera": "Alacsony szubjektív a homokozó pereme alól.", "cut": "A felnézés irányát és a deszkák fényréseit megtartjuk.", "number": 203, "width": 1600, "height": 905, "image": "kepek/kepek-11.js"}, {"id": "homok-H07", "section": "06 · Vissza a játszótérre, felnézés", "title": "Felnézés a deszkarésekre", "action": "A fejünk fölötti deszkák között kisüt a nap; a fényrések kerülnek a figyelmünk közepébe.", "camera": "Felfelé néző szubjektív a deszkák alatt.", "cut": "A felnézés irányát és a deszkák fényréseit megtartjuk.", "number": 204, "width": 1600, "height": 905, "image": "kepek/kepek-11.js"}, {"id": "csikos-nyitas-vazlat", "number": 205, "section": "07 · Csíkos világ", "title": "Lécek fölött az ég", "action": "A búvóhelyről a falécek közötti ég felé nézünk.", "camera": "Fekvő POV, felfelé.", "cut": "A következő nézet: Kifakul a fa. A mozgás és a térirány folytatódik.", "width": 1600, "height": 553, "image": "kepek/kepek-11.js"}, {"id": "csikos-nyitas-vazlat-kep-02", "number": "205a", "section": "07 · Csíkos világ", "title": "Kifakul a fa", "action": "A lécek színe lassan eltűnik; a rések még az eget mutatják.", "camera": "Ugyanaz a mozdulatlan POV.", "cut": "A következő nézet: Kirajzolódnak az erezetek. A mozgás és a térirány folytatódik.", "width": 1600, "height": 553, "image": "kepek/kepek-11.js"}, {"id": "csikos-nyitas-vazlat-kep-03", "number": "205b", "section": "07 · Csíkos világ", "title": "Kirajzolódnak az erezetek", "action": "A fa erezete fehér vonalakként marad meg.", "camera": "Azonos keretezés, lassú átalakulás.", "cut": "A következő nézet: Eltűnik az ég. A mozgás és a térirány folytatódik.", "width": 1600, "height": 551, "image": "kepek/kepek-11.js"}, {"id": "csikos-nyitas-vazlat-kep-04", "number": "205c", "section": "07 · Csíkos világ", "title": "Eltűnik az ég", "action": "A rések is feketévé válnak; már csak a vonalak tartják a teret.", "camera": "Felfelé néző POV.", "cut": "A következő nézet: A vonal talajjá fordul. A mozgás és a térirány folytatódik.", "width": 1600, "height": 551, "image": "kepek/kepek-11.js"}, {"id": "csikos-nyitas-vazlat-kep-05", "number": "205d", "section": "07 · Csíkos világ", "title": "A vonal talajjá fordul", "action": "A tekintet lefordul a hullámzó vonalföldre; messze emberalakok.", "camera": "Lassú lefordulás, alacsony horizont.", "cut": "A következő nézet: Feláll a hullám. A mozgás és a térirány folytatódik.", "width": 1600, "height": 529, "image": "kepek/kepek-11.js"}, {"id": "csikos-nyitas-vazlat-kep-06", "number": "205e", "section": "07 · Csíkos világ", "title": "Feláll a hullám", "action": "A talajvonulat felemelkedik, az embersor az ívére kerül.", "camera": "Alacsony tág feltárás.", "cut": "A következő nézet: Lélegző talaj. A mozgás és a térirány folytatódik.", "width": 1600, "height": 529, "image": "kepek/kepek-11.js"}, {"id": "csikos-vonalvilag-feltaras", "number": 206, "section": "07 · Csíkos világ", "title": "Lélegző talaj", "action": "Az üres vonalföld enyhén megemelkedik és visszasüllyed.", "camera": "Talajközeli megfigyelés.", "cut": "A következő nézet: Séta az íven. A mozgás és a térirány folytatódik.", "width": 1600, "height": 558, "image": "kepek/kepek-11.js"}, {"id": "csikos-vonalvilag-feltaras-kep-02", "number": "206a", "section": "07 · Csíkos világ", "title": "Séta az íven", "action": "Az emberek egymást követve haladnak a felálló hullám mentén.", "camera": "Tág oldalnézet.", "cut": "A következő nézet: Két kísérő. A mozgás és a térirány folytatódik.", "width": 1600, "height": 561, "image": "kepek/kepek-11.js"}, {"id": "csikos-vonalvilag-feltaras-kep-03", "number": "206b", "section": "07 · Csíkos világ", "title": "Két kísérő", "action": "Kúp- és hengerfejű alak áll elénk, a menet felé fordulnak.", "camera": "Alacsony nézet a hátuk mögül.", "cut": "A következő nézet: Követjük a sort. A mozgás és a térirány folytatódik.", "width": 1600, "height": 556, "image": "kepek/kepek-11.js"}, {"id": "csikos-vonalvilag-feltaras-kep-04", "number": "206c", "section": "07 · Csíkos világ", "title": "Követjük a sort", "action": "A hullám tövénél az embersorral párhuzamosan megyünk.", "camera": "Oldalazó POV.", "cut": "A következő nézet: A perem belseje. A mozgás és a térirány folytatódik.", "width": 1600, "height": 559, "image": "kepek/kepek-11.js"}, {"id": "csikos-vonalvilag-feltaras-kep-05", "number": "206d", "section": "07 · Csíkos világ", "title": "A perem belseje", "action": "Az ív belső oldalán folytatódik a menet; a mélység feltárul.", "camera": "Rövid lenézés a peremről.", "cut": "A következő nézet: Testből nyíló átjáró. A mozgás és a térirány folytatódik.", "width": 1600, "height": 562, "image": "kepek/kepek-11.js"}, {"id": "csikos-vonalvilag-feltaras-kep-06", "number": "206e", "section": "07 · Csíkos világ", "title": "Testből nyíló átjáró", "action": "Egy óriási vonalalak mellkasában környílás nyílik.", "camera": "Tág POV, a kísérők előttünk.", "cut": "A következő nézet: Óriás kezei. A mozgás és a térirány folytatódik.", "width": 1600, "height": 564, "image": "kepek/kepek-11.js"}, {"id": "csikos-oriasok", "number": 207, "section": "07 · Csíkos világ", "title": "Óriás kezei", "action": "Két hatalmas kéz ér földet a menet két oldalán.", "camera": "Nagyon alacsony frontális nézet.", "cut": "A következő nézet: Lehajló óriás. A mozgás és a térirány folytatódik.", "width": 1600, "height": 658, "image": "kepek/kepek-11.js"}, {"id": "csikos-oriasok-kep-02", "number": "207a", "section": "07 · Csíkos világ", "title": "Lehajló óriás", "action": "Az óriás az embersor fölé hajol, fejében örvénylő kör.", "camera": "Lassú felnézés.", "cut": "A következő nézet: Szétszórt tömeg. A mozgás és a térirány folytatódik.", "width": 1600, "height": 658, "image": "kepek/kepek-11.js"}, {"id": "csikos-oriasok-kep-03", "number": "207b", "section": "07 · Csíkos világ", "title": "Szétszórt tömeg", "action": "A megkoronázott alak előtt még szabálytalan a tömeg.", "camera": "Tág nézet a két kísérő mögül.", "cut": "A következő nézet: Rendbe állnak. A mozgás és a térirány folytatódik.", "width": 1600, "height": 667, "image": "kepek/kepek-11.js"}, {"id": "csikos-oriasok-kep-04", "number": "207c", "section": "07 · Csíkos világ", "title": "Rendbe állnak", "action": "A ritmusra a tömeg szabályos sorokba rendeződik.", "camera": "Ugyanaz a nézet, változás a tömegben.", "cut": "A következő nézet: Új irány. A mozgás és a térirány folytatódik.", "width": 1600, "height": 667, "image": "kepek/kepek-11.js"}, {"id": "csikos-oriasok-kep-05", "number": "207d", "section": "07 · Csíkos világ", "title": "Új irány", "action": "A sor a négylábú csőszerű lény felé kanyarodik.", "camera": "Alacsony követő totál.", "cut": "A következő nézet: Az óriás alatt. A mozgás és a térirány folytatódik.", "width": 1600, "height": 695, "image": "kepek/kepek-11.js"}, {"id": "csikos-oriasok-kep-06", "number": "207e", "section": "07 · Csíkos világ", "title": "Az óriás alatt", "action": "A kísérőkkel a magas lábak közé érünk.", "camera": "POV felnézéssel.", "cut": "A következő nézet: A hullám hátán. A mozgás és a térirány folytatódik.", "width": 1600, "height": 695, "image": "kepek/kepek-11.js"}, {"id": "csikos-elso-voros", "number": 208, "section": "07 · Csíkos világ", "title": "A test kapuja felé", "action": "A fehér kúpfejű és hengerfejű alak az óriás mellkasának környílásához vezet. Nincsenek érzelmek; várakozó, neutrális hangulat.", "camera": "Alacsony POV a két alak mögött.", "cut": "Az út tengelyét tartva közelebb érünk a körkapuhoz.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-elso-voros-kep-02", "number": "208a", "section": "07 · Csíkos világ", "title": "Megállnak a bejáratnál", "action": "A két alak a körkapu előtt megáll. A fekete nyílás mélyén vörös függöny sejlik fel.", "camera": "Alacsony frontális közeledés, a kör egészben.", "cut": "A vörös függöny felé tartva lépünk át a körkapu peremén.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-elso-voros-kep-03", "number": "208b", "section": "07 · Csíkos világ", "title": "Át a mellkaskapun", "action": "Átlépünk a környíláson. A perem még keretez, de bent már látszik a pettyes gömb emelvénye és a két oldalsó őr. A két figura előttünk halad; a padló megszakítás nélkül vezet a gömbhöz.", "camera": "Áthaladó POV, a kör széle még keretez.", "cut": "A két figura mögött, ugyanazon a tengelyen érkezünk a gömb termébe.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-elso-voros-kep-04", "number": "208c", "section": "07 · Csíkos világ", "title": "Belépnek a gömb termébe", "action": "A kúpfejű balra, a hengerfejű jobbra lép be előttünk. A vörös függönyös emelvényen pettyes, elefántcsontszínű gömb áll. Az emelvény két oldalán egy-egy sötétkék ruhás őr figyeli őket. A jobb oldali vörös-arany ajtó zárva.", "camera": "Alacsony POV a két figura háta mögül; gömb, két őr és kijárat közös képen.", "cut": "Egy keveset közeledünk a figurák mögött; mindenki a helyén marad.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-elso-voros-kep-05", "number": "208d", "section": "07 · Csíkos világ", "title": "Nézik a gömböt, az őrök őket nézik", "action": "A két figura háttal áll előttünk és a gömböt nézi. A két oldalsó őr mozdulatlanul figyeli őket. Kivárunk: egyelőre nem értik, mit várnak tőlük.", "camera": "Ugyanazon tengelyen szűkebb hátsó közös kép; a gömb középen.", "cut": "Az első koppanásra az őrök lába felé billen a tekintet.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-terem-kamerak", "number": 209, "section": "07 · Csíkos világ", "title": "Az őrök lábbal szólnak", "action": "A bal és a jobb oldali őr felváltva koppant a fekete cipőjével. Két rövid koppanás, szünet, majd egy hosszú. A két fehér figura ugyanott áll, és lefelé figyel.", "camera": "Alacsony közös kép; a két őr lába, a figurák és a középső gömb is felismerhető.", "cut": "A megismételt ritmust a bal oldali őr cipőjén mutatjuk közelről.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-terem-kamerak-kep-04", "number": "209c", "section": "07 · Csíkos világ", "title": "A kopogás mintája", "action": "A bal oldali őr megemeli a cipőjét, majd a sakktáblás padlón megismétli a jelet. A sötétkék nadrágszár és az emelvény széle rögzíti, ki kopog és hol áll.", "camera": "Padlószintű cipőközeli, az előző kép tengelyén.", "cut": "Az utolsó koppanásról a két fehér figura cipőjére vágunk; ugyanaz a ritmus válaszol.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-ritmus-ater", "number": 211, "section": "07 · Csíkos világ", "title": "A két figura visszakopog", "action": "A kúpfejű és a hengerfejű a saját cipőjével megismétli az őrök ritmusát. A két fehér nadrágszár alapján egyértelmű, hogy most ők válaszolnak. Az utolsó koppanás után jobbról kattan a zár.", "camera": "Alacsony hátsó lábközeli mindkét figuráról, sakktáblás padlóval.", "cut": "A zár kattanására jobbra fordulunk; a nyíló ajtó okaként a sikeres válasz marad meg.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-ritmus-ater-kep-02", "number": "211a", "section": "07 · Csíkos világ", "title": "A válaszra kinyílik az ajtó", "action": "A terem jobb oldali vörös-arany ajtaja kinyílik a világos, vonalrajzos udvarra. A két figura felé fordul; a gömb és a két őr változatlan helyen marad.", "camera": "Alacsony tág kép ugyanabból a teremből; az ajtó jobbra, a gömb középen.", "cut": "Az ajtó nyitva marad, a két figura elindul felé.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-ritmus-ater-kep-03", "number": "211b", "section": "07 · Csíkos világ", "title": "Távoznak a teremből", "action": "A két fehér figura a nyitott jobb oldali ajtón át az udvarra lép. A pettyes gömb és a két őr mögöttük marad a vörös függönyös teremben. Követjük őket.", "camera": "Alacsony követő POV, az ajtó és a külső udvar előttünk.", "cut": "Folyamatos áthaladás a már látható küszöbön; a következő képen ugyanaz az udvar nyílik ki.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-ritmus-ater-kep-04", "number": "211c", "section": "07 · Csíkos világ", "title": "A küszöb két oldala", "action": "Bal képszélen még a sakktáblás terem, előttünk az udvar fehér vonalas kövezete. A két alak kilép, kinti koppanásokra fordítja a fejét.", "camera": "Küszöbszintű áthaladó POV.", "cut": "A szabad tér kitágul előttünk; a kinti koppanások irányába haladunk.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-termek-ritmus", "number": 212, "section": "07 · Csíkos világ", "title": "Odakint is így beszélnek", "action": "A vonalrajzos udvarban az emberek padon, térden, falon és cipővel a kövön kopogva felelnek egymásnak. A két érkező már felismeri ezt. A jobb hátsó boltívből vörös fejfedős őrök lépnek ki értük.", "camera": "Alacsony udvari nagytotál, párhuzamos kis beszélgetésekkel és a megjelenő őrökkel.", "cut": "A közeledő őrökhöz fordulunk; a két érkező a helyén vár.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-termek-ritmus-kep-02", "number": "212a", "section": "07 · Csíkos világ", "title": "Az őrök értük jönnek", "action": "A két vörös fejfedős őr a boltívtől a két fehér alakhoz lép. Az egyik a falon lekopog egy rövid hívójelet, a másik a folyosó bejáratára mutat.", "camera": "Alacsony közös kép: érkezők elöl, őrök előttük, boltív mögöttük.", "cut": "A két érkező a cipőjével válaszol a hívásra.", "width": 1600, "height": 905, "image": "kepek/kepek-12.js"}, {"id": "csikos-fura-kamerak", "number": 214, "section": "07 · Csíkos világ", "title": "Elfogadják a kíséretet", "action": "A fehér alakok visszakopogják a hívást. Az őrök megfordulnak és a jobb hátsó boltív felé vezetik őket.", "camera": "Alacsony POV a két alak mögött, a folyosó szája már látszik.", "cut": "Az őrök után belépünk a boltíven, és közvetlenül a folyosó belső követő nézetén folytatjuk.", "width": 1600, "height": 905, "image": "kepek/kepek-13.js"}, {"id": "csikos-fura-kamerak-kep-04", "number": "214c", "section": "07 · Csíkos világ", "title": "A folyosó válaszol", "action": "Az egyik őr cipője koppan, a távolabbi őr kézzel a falon felel. A fura portrék tekintete követi az elhaladókat. A két fehér alak végig a kíséretben marad.", "camera": "Alacsony váll melletti követés, kéz, cipő és portrék együtt.", "cut": "Az út balra fordul; az előttünk haladó őrrel együtt fordulunk.", "width": 1600, "height": 905, "image": "kepek/kepek-13.js"}, {"id": "csikos-fura-kamerak-kep-05", "number": "214d", "section": "07 · Csíkos világ", "title": "Jel a következő ajtónál", "action": "A bal oldali vörös-arany ajtónál az őr megáll és lekopogja az érkezés ritmusát az ajtófélfán. A túloldalról cipőkoppanás felel.", "camera": "Alacsony oldalnézet a két fehér alakkal és a zárt ajtóval.", "cut": "A belső válasz után az ajtó kinyílik.", "width": 1600, "height": 905, "image": "kepek/kepek-13.js"}, {"id": "csikos-atvezetes-214da", "number": "214da", "section": "07 · Csíkos világ", "title": "Először a kék terem küszöbén", "action": "A bal oldali ajtó megnyílik. Először látunk be a kék terembe: egy férfi a vörös padon ül, szemben a fal nagy körlapjával. A két fehér alak belép, az őrök az ajtónál maradnak.", "camera": "Alacsony áthaladó POV, folyosó és kék terem egy képen.", "cut": "A küszöbről a terem belsejébe lépünk; ez egyetlen folyamatos megérkezés.", "width": 1600, "height": 905, "image": "kepek/kepek-13.js"}, {"id": "csikos-termek-ritmus-kep-06", "number": "212e", "section": "07 · Csíkos világ", "title": "Az ülő alak kezdi a nyitót", "action": "A férfi a vörös padon ül, szemben a körlappal. A két fehér érkező balra figyel. A férfi cipővel lekopogja a gömböt megnyitó ritmust; minden koppanásra változik a körlap.", "camera": "Alacsony közös térkép, láb és körlap együtt.", "cut": "A hallható ritmus látható forrásához, a cipőjéhez közelítünk.", "width": 1600, "height": 905, "image": "kepek/kepek-13.js"}, {"id": "csikos-fura-kamerak-kep-06", "number": "214e", "section": "07 · Csíkos világ", "title": "A gömbnyitó lábritmus", "action": "A fekete cipő sarka lent marad, az orra koppan. Két rövid, szünet, hosszú, majd újabb rövid jel zárja a nyitóritmust.", "camera": "Lábközeli a vörös pad alatt, a kék terem anyagaival.", "cut": "Az utolsó koppanásra a körlap kidomborodik; visszavágunk a falra.", "width": 1600, "height": 905, "image": "kepek/kepek-13.js"}, {"id": "csikos-gomb-kepi-vazlat", "number": 215, "section": "07 · Csíkos világ", "title": "A kopogásból megnyílik a gömb", "action": "A végső koppanásra a körlap térbelivé domborodik, és a szürke, vörös-fekete szálas gömb elválik a kék faltól. Az ülő alak és a két érkező a helyén marad.", "camera": "Alacsony közös nézet, a kibomló gömb és az ülő alak együtt.", "cut": "Ugyanebből az alacsony nézetből figyeljük, ahogy a gömb mögött kettéválik a kék szoba.", "width": 1600, "height": 905, "image": "kepek/kepek-13.js"}, {"number": "215ny1", "section": "07 · Csíkos világ", "id": "csikos-atvezetes-215ny1", "title": "Kettéválik a kék szoba", "action": "A kék szoba középen kettéválik. A két falrész lassan oldalra indul; a gömb elválik a faltól, és előttünk a helyén marad. A nyílás mögött feltűnik a világos külső tér.", "camera": "Alacsony POV, az előző kép tengelyén; a gömb középen marad.", "cut": "A két szobafél oldalra tartó mozgását ugyanebből az irányból folytatjuk.", "width": 1600, "height": 905, "image": "kepek/kepek-13.js"}, {"number": "215ny2", "section": "07 · Csíkos világ", "id": "csikos-atvezetes-215ny2", "title": "A szoba eltűnik a gömb körül", "action": "A szoba két fele tovább távolodik és eltűnik. A csíkos padlót a világos tér talaja veszi át. A gömb előttünk marad; fekete ruhás alakok közelednek hozzá, hogy továbbgördítsék.", "camera": "Talajközeli kitáguló POV; a két kék falszél kifut, a gömb előttünk marad.", "cut": "A közeledő fekete alakok cipői közé süllyedve közelítünk a már megmutatott gömbhöz.", "width": 1600, "height": 905, "image": "kepek/kepek-13.js"}, {"id": "csikos-gomb-kepi-vazlat-kep-02", "number": "215a", "section": "07 · Csíkos világ", "title": "Kigurul a gömb", "action": "A szobából nyíló világos téren fekete ruhás alakok tolják a gömböt.", "camera": "Cipők közötti alacsony nézet.", "cut": "A következő nézet: Köré gyűlnek. A mozgás és a térirány folytatódik.", "width": 1286, "height": 1100, "image": "kepek/kepek-13.js"}, {"id": "csikos-gomb-kepi-vazlat-kep-03", "number": "215b", "section": "07 · Csíkos világ", "title": "Köré gyűlnek", "action": "A társaság körülveszi a gömböt, egyre többen támasztják.", "camera": "Rövid ferde rálátás a csoportra.", "cut": "A következő nézet: Megbillen a tér. A mozgás és a térirány folytatódik.", "width": 1298, "height": 1100, "image": "kepek/kepek-13.js"}, {"id": "csikos-gomb-kepi-vazlat-kep-04", "number": "215c", "section": "07 · Csíkos világ", "title": "Megbillen a tér", "action": "Közelről követjük a gömböt; a talaj fordulni kezd alattunk.", "camera": "Földközeli POV, folyamatos kamerafordulás.", "cut": "A következő nézet: Ég felé esik. A mozgás és a térirány folytatódik.", "width": 1300, "height": 1100, "image": "kepek/kepek-13.js"}, {"id": "csikos-gomb-kepi-vazlat-kep-05", "number": "215d", "section": "07 · Csíkos világ", "title": "Ég felé esik", "action": "A talaj már a fejünk fölött van; a gömb elszakad tőle, az ég felé zuhan.", "camera": "180 fokig fordult POV.", "cut": "A következő nézet: A gömb után zuhanunk. A mozgás és a térirány folytatódik.", "width": 1289, "height": 1100, "image": "kepek/kepek-13.js"}, {"id": "csikos-gomb-kepi-vazlat-kep-06", "number": "215e", "section": "07 · Csíkos világ", "title": "A gömb után zuhanunk", "action": "A fordított föld távolodik, a gömb tölti ki előttünk a képet.", "camera": "Zuhanó POV a gömb mögött.", "cut": "A következő nézet: Leesünk az óriások közé. A mozgás és a térirány folytatódik.", "width": 1300, "height": 1100, "image": "kepek/kepek-13.js"}, {"id": "diszko-robbanas", "section": "08 · A gömb érkezése és diszkó", "title": "Leesünk az óriások közé", "action": "A fordított földtől elszakadt gömbbel együtt zuhanunk. Alattunk az óriások hosszú csíkos lábai közötti talaj közeledik.", "camera": "Zuhanó POV, alacsony érkezéssel.", "cut": "A gömb földet ér; a talaj irányát megtartva érkezünk a társaság közé.", "number": 216, "width": 1600, "height": 905, "image": "kepek/kepek-13.js"}, {"id": "diszko-erkezes", "section": "08 · A gömb érkezése és diszkó", "title": "A gömb földet ér", "action": "A gömb az óriások lábai között ér földet. A nézőpont is ugyanebbe a talajközeli magasságba érkezik.", "camera": "20 cm magas POV, felnézéssel.", "cut": "A környező térből felemelkednek a falak.", "number": 217, "width": 1600, "height": 900, "image": "kepek/kepek-13.js"}, {"id": "diszko-falak-217a", "number": "217a", "section": "08 · A gömb érkezése és diszkó", "title": "Felnőnek a falak", "action": "A gömb még a talajon áll. Körülöttünk félmagasságig felemelkednek a teal falpanelek és a galéria; fölöttük még szabad az ég.", "camera": "Ugyanaz a 20 cm magas nézőpont és szereplőelrendezés.", "cut": "A falak tovább nőnek, fölöttünk összeáll a tető.", "width": 1600, "height": 900, "image": "kepek/kepek-13.js"}, {"id": "diszko-falak-217b", "number": "217b", "section": "08 · A gömb érkezése és diszkó", "title": "Felfüggesztik a gömböt", "action": "A falak elérik teljes magasságukat, a tetőgerendák összeállnak. A kifeszülő kábel felemeli a gömböt; közben megtelik a terem.", "camera": "Azonos talajközeli POV, a kábel és a gömb útja együtt látszik.", "cut": "A gömb függő helyzetbe ér, a társaság táncolni kezd.", "width": 1600, "height": 900, "image": "kepek/kepek-14.js"}, {"id": "diszko-P01_party_tall", "section": "08 · A gömb érkezése és diszkó", "title": "A közös tánc", "action": "A függő gömb alatt a nagyon magas, eltérő maszkos alakok táncolnak. A ruhaanyagok és a papírmaszkok tapinthatóak.", "camera": "Frontális talajközeli totál, 20 cm magasságban.", "cut": "A lépések közé oldalra mozdulunk.", "number": 218, "width": 1600, "height": 900, "image": "kepek/kepek-14.js"}, {"id": "diszko-P02_party_oldal", "section": "08 · A gömb érkezése és diszkó", "title": "Cipők között", "action": "Egy nagy cipő keresztezi előttünk a képet. Mögötte két táncos együtt fordul, a többiek a galérián is mozognak.", "camera": "Oldalirányú mozgás, változatlan 20 cm magasságban.", "cut": "A cipő takarásában a tér ellenkező iránya felé fordulunk.", "number": 219, "width": 1600, "height": 900, "image": "kepek/kepek-14.js"}, {"id": "diszko-P03_party_ellen", "section": "08 · A gömb érkezése és diszkó", "title": "Észrevesz minket", "action": "Két hosszú nadrágszár között a szőke, szemes maszkos figura lehajol. A tánc mögötte tovább tart.", "camera": "Ellenirányú alsó nézet; még mindig 20 cm magasan.", "cut": "A lehajló arc és a leereszkedő karok a felemeléshez vezetnek.", "number": 220, "width": 1600, "height": 900, "image": "kepek/kepek-14.js"}, {"id": "kez-H01", "section": "09 · Kézről kézre, ki az ablakon", "title": "Felemel a szőke figura", "action": "A maszkos nő közel hajol és felemeli a nézőpontot. A háttérben eltérő maszkos óriások táncolnak.", "camera": "POV a támasztó kéz fölött; a saját test és a tenyér nem látszik.", "cut": "A nő az olívazöld kabátos férfi felé nyújt minket.", "number": 221, "width": 1600, "height": 905, "image": "kepek/kepek-14.js"}, {"id": "kez-H02", "section": "09 · Kézről kézre, ki az ablakon", "title": "Átad az olívazöld kabátosnak", "action": "A kerek aranyszemüveges, rózsaszín arcú férfi átvesz minket. A szőke figura balra távolodik, alattunk folytatódik a parti.", "camera": "Emelkedő közeli POV a kéz szintjéről; tenyér nem takarja a képet.", "cut": "A férfi tovább fordul a rózsaszín kabátos nőhöz.", "number": 222, "width": 1600, "height": 905, "image": "kepek/kepek-14.js"}, {"id": "kez-H03", "section": "09 · Kézről kézre, ki az ablakon", "title": "Még feljebb a galériánál", "action": "A kék fejfedős, szemmaszkos nő átveszi a nézőpontot és a felső ablak felé emeli. Az előző hordozó balra marad.", "camera": "POV a hordozó tenyérszintjéből; az alátámasztó kéz a kép alatt van.", "cut": "Az ablak irányába fordulva megjelenik a madármaszkos figura.", "number": 223, "width": 1600, "height": 900, "image": "kepek/kepek-14.js"}, {"id": "kez-H04", "section": "09 · Kézről kézre, ki az ablakon", "title": "A felső ablaknál", "action": "A madármaszkos alak mellett kinézünk a hosszúlábú városra. Az alátámasztó tenyér a kamera alatt van, teljesen láthatatlan.", "camera": "POV az ablak magasságában; nincs tenyér, ujj vagy saját kéz a látómezőben.", "cut": "A párkány felé mozdulunk, majd az utca mélységére nézünk.", "number": 224, "width": 1600, "height": 900, "image": "kepek/kepek-14.js"}, {"id": "kez-H05", "section": "09 · Kézről kézre, ki az ablakon", "title": "Kint a városban", "action": "Az ablakon túl a következő mozdulat a járdához visz.", "camera": "Szubjektív, a hordozó kéz magasságában.", "cut": "Folytonos lefelé mozgással a járdára érkezünk.", "number": 225, "width": 1600, "height": 905, "image": "kepek/kepek-14.js"}, {"id": "varos-S01", "section": "10 · Rohanó város és földalatti", "title": "Letesznek a járdára", "action": "Az ablakból kapott nézőpontot a csíkos figura a járdára teszi; az első óriási cipő elsiet előttünk.", "camera": "Apró szubjektív; 10–15 cm magas kamera, talajközelben.", "cut": "Az útirányt és a rohanás mozdulatát megtartva folytatjuk.", "number": 226, "width": 1600, "height": 905, "image": "kepek/kepek-14.js"}, {"id": "varos-S02", "section": "10 · Rohanó város és földalatti", "title": "Útvonal a rohanásban", "action": "A fekete cipő balra lép előlünk, jobbra a zöld busz halad, meglátjuk a továbbvezető utcát.", "camera": "12 cm magas POV, enyhén felfelé billentve.", "cut": "A középső szabad sávba indulunk, a mellettünk futó lábakat követve.", "number": 227, "width": 1600, "height": 900, "image": "kepek/kepek-14.js"}, {"id": "varos-S03", "section": "10 · Rohanó város és földalatti", "title": "Velünk párhuzamosan", "action": "Balról egy hosszú lábú csoport fut mellettünk; jobbra a busz lábai ugyanabban a ritmusban gyorsulnak. A kamera velük halad.", "camera": "Apró szubjektív; 10–15 cm magas kamera, talajközelben.", "cut": "Az útirányt és a rohanás mozdulatát megtartva folytatjuk.", "number": 228, "width": 1600, "height": 905, "image": "kepek/kepek-14.js"}, {"id": "varos-S04", "section": "10 · Rohanó város és földalatti", "title": "A cipők folyama", "action": "A futó lábak között araszolunk; a zebra fehér csíkját követjük, minden lépés pillanatra eltakarja az utat.", "camera": "Apró szubjektív; 10–15 cm magas kamera, talajközelben.", "cut": "Az útirányt és a rohanás mozdulatát megtartva folytatjuk.", "number": 229, "width": 1600, "height": 905, "image": "kepek/kepek-14.js"}, {"id": "varos-S05", "section": "10 · Rohanó város és földalatti", "title": "A megszökött kalap", "action": "Egy piros kalap a lábak között gurul. Egy hosszú kezű figura visszanyúl érte, a kalap elszökik a következő cipő alatt.", "camera": "Apró szubjektív; 10–15 cm magas kamera, talajközelben.", "cut": "Az útirányt és a rohanás mozdulatát megtartva folytatjuk.", "number": 230, "width": 1600, "height": 905, "image": "kepek/kepek-14.js"}, {"id": "varos-S06", "section": "10 · Rohanó város és földalatti", "title": "A busz megáll cipőt kötni", "action": "A soklábú busz előttünk megtorpan: egyik lábának kioldódott a cipőfűzője. A többi láb türelmetlenül topog.", "camera": "Apró szubjektív; 10–15 cm magas kamera, talajközelben.", "cut": "Az útirányt és a rohanás mozdulatát megtartva folytatjuk.", "number": 231, "width": 1600, "height": 905, "image": "kepek/kepek-14.js"}, {"id": "varos-S07", "section": "10 · Rohanó város és földalatti", "title": "A jármű alól", "action": "A megálló lábas jármű alá bújunk. Fölöttünk az alváza, túloldalt magas, különböző maszkos járókelők kereszteznek.", "camera": "12 cm magas POV az alváz alatt.", "cut": "Jobbra fordulva a kilépő piros cipőket követjük.", "number": 232, "width": 1600, "height": 900, "image": "kepek/kepek-14.js"}, {"id": "varos-S08", "section": "10 · Rohanó város és földalatti", "title": "A piros sarkak mögött", "action": "A ház alatti gerendák között a piros cipőpár átér a túloldalra. A résen át követjük a zebrához.", "camera": "Talajközeli POV a sarkak mögött, jobbra fordulva.", "cut": "Kilépünk a fedett résből; a járdaszegély mellett egy újabb cipő érkezik.", "number": 233, "width": 1600, "height": 900, "image": "kepek/kepek-14.js"}, {"id": "varos-S09", "section": "10 · Rohanó város és földalatti", "title": "Kikerüljük a talpat", "action": "A fekete cipő a rács mellé lép. Jobbról megkerüljük; a járdaszegély vonala a már látható metrólejárathoz vezet.", "camera": "12 cm magas POV, rövid jobbra kitéréssel.", "cut": "A középen látott lejáratot megtartva közelítünk hozzá.", "number": 234, "width": 1600, "height": 900, "image": "kepek/kepek-14.js"}, {"id": "varos-S10", "section": "10 · Rohanó város és földalatti", "title": "A ház alatt a lejáratig", "action": "A két láb között feltárul a metrólejárat. Magas maszkos járókelők rohannak el kétoldalt; mi középen átjutunk.", "camera": "Apró POV a ház alatt, a lejárat végig középen.", "cut": "Az épület lábát elhagyva lefelé billenünk a lépcsőre.", "number": 235, "width": 1600, "height": 900, "image": "kepek/kepek-14.js"}, {"id": "varos-S11", "section": "10 · Rohanó város és földalatti", "title": "Lemenekülünk a földalattiba", "action": "A lépcső tetején befordulunk. Fentről még futó cipők villannak, lent a türkiz–korall állomás fénye hívogató.", "camera": "Apró szubjektív; 10–15 cm magas kamera, talajközelben.", "cut": "Az útirányt és a rohanás mozdulatát megtartva folytatjuk.", "number": 236, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S12", "section": "10 · Rohanó város és földalatti", "title": "A madárfejű utasok között", "action": "A peronon a magas sarkú cipők között jutunk az ajtóig. Két madárfejű utas félrelép, épp akkora rés marad, hogy beférjünk.", "camera": "Apró szubjektív; 10–15 cm magas kamera, talajközelben.", "cut": "Az útirányt és a rohanás mozdulatát megtartva folytatjuk.", "number": 237, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S13", "section": "10 · Rohanó város és földalatti", "title": "A szem mutatja az utat", "action": "Bent egy levált szem siklik előttünk a padlón. Követjük a vörös-fehér mintán; az ajtón kívül még lábak rohannak, majd összezárul.", "camera": "Apró szubjektív; 10–15 cm magas kamera, talajközelben.", "cut": "Az útirányt és a rohanás mozdulatát megtartva folytatjuk.", "number": 238, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S14", "section": "10 · Rohanó város és földalatti", "title": "Kiszállás a lépcsőhöz", "action": "Kinyílik a vonat ajtaja. A kockás padlón áthaladunk a kijárati lépcsőhöz; két magas maszkos utas már felfelé tart. Mindenki megy, rohan valamerre.", "camera": "Talajközeli POV az ajtótól a lépcső felé.", "cut": "A két kapaszkodó között ugyanabban az irányban indulunk felfelé.", "number": 239, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "varos-S15", "section": "10 · Rohanó város és földalatti", "title": "A lábas automata", "action": "A metró másik kijáratán egy lábas jegyautomata topog el előttünk. Alatta átjutva ismét kint vagyunk a városban. De mindenki egy irányban rohan.", "camera": "Apró szubjektív; 10–15 cm magas kamera, talajközelben.", "cut": "Az útirányt és a rohanás mozdulatát megtartva folytatjuk.", "number": 240, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S16", "section": "10 · Rohanó város és földalatti", "title": "Az út végén már a doboz", "action": "Az utcára kiérve meglátjuk a távoli dobozt. A magas alakok mind felé rohannak; mögötte már nincs város.", "camera": "12 cm magas előrehaladó POV.", "cut": "A dobozt végig a haladási irányunkban tartjuk.", "number": 241, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S17", "section": "10 · Rohanó város és földalatti", "title": "Három menet összefut", "action": "Három irányból csatlakoznak a rohanók, és ugyanarra az útra fordulnak a dobozhoz.", "camera": "Alacsony csomóponti nézet.", "cut": "A becsatlakozó mozgásokat azonos előreirányban követjük.", "number": 242, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S18", "section": "10 · Rohanó város és földalatti", "title": "A házak is csatlakoznak", "action": "Egy lábakon járó ház és egy busz a rohanók mögé fordul. Mind ugyanahhoz a dobozhoz tartanak.", "camera": "Alsó követő kép a két nagyobb szereplővel.", "cut": "A doboz egyre nagyobban látszik előttünk.", "number": 243, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S19", "section": "11 · A doboz", "title": "Elfogy az utca", "action": "Az út a doboznál ér véget. Mögötte üres tér.", "camera": "Talajközeli közeledés.", "cut": "A megérkezők előtt a fedél felemelkedik.", "number": 244, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S20", "section": "11 · A doboz", "title": "Kinyílik a doboz", "action": "A különálló fedél függőlegesen felemelkedik. Belül fekete mélység; az első rohanók már a peremnél vannak.", "camera": "Alacsony frontális nézet.", "cut": "A nyitás befejeződik, az első alakok ugrani kezdenek.", "number": 245, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S21", "section": "11 · A doboz", "title": "A rohanók nyomában", "action": "A cipők között követjük az utolsó métereket. A nyitott doboz és felemelt fedele végig előttünk marad.", "camera": "12 cm magas mozgó POV.", "cut": "A futólépés az első ugróhullám mozdulatára vezet.", "number": 246, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S22", "section": "11 · A doboz", "title": "Az első valódi ugrások", "action": "Egy alak még rugaszkodik a földön, egy másik felhúzott térddel a nyílás fölött van, a harmadik már félig eltűnt a fekete belsőben. Mind a dobozba ugrik.", "camera": "12 cm magas bal első háromnegyedes nézet.", "cut": "Az ugrás lefelé tartó szakaszát a doboz másik sarkából folytatjuk.", "number": 247, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S25", "section": "11 · A doboz", "title": "Az utolsó alak is bent van", "action": "Az utolsó kalap és kéz is a perem alá tűnik. A fedél még magasan áll, az út üres; mi maradtunk utoljára.", "camera": "Közeledő alacsony POV, közeli peremmel.", "cut": "A szabaddá vált nyílás felé indulunk és elrugaszkodunk.", "number": 250, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S26", "section": "11 · A doboz", "title": "Mi vagyunk az utolsók", "action": "A nézőpont átbillen a peremen. Alattunk fekete a doboz belseje, mögöttünk már senki sem érkezik.", "camera": "Előrebukó POV; saját test és kéz nem látszik.", "cut": "A perem fölött átlendülve a sötét belsőbe esünk.", "number": 251, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S27", "section": "11 · A doboz", "title": "Odabent bezárul a fedél", "action": "A nézőpont már a dobozban süllyed. Fölöttünk a fedél ereszkedik, a keskeny fényrés eltűnik.", "camera": "Belső POV, fölfelé fordulva a záródó nyílásra.", "cut": "Teljes sötét; a következő jelenet első vonalai előtt hosszan kivárunk.", "number": 252, "width": 1600, "height": 905, "image": "kepek/kepek-15.js"}, {"id": "varos-S28", "section": "11 · A doboz", "title": "Sötét", "action": "A fedél bezárult. Teljesen fekete kép; a következő világ még nem látszik.", "camera": "Apró szubjektív; 10–15 cm magas kamera, talajközelben.", "cut": "A doboz sötétjében időzünk; lassan felgyulladnak az első vonalak.", "number": 253, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-X00", "section": "12 · Bábel világa", "title": "Teljes sötét — időt hagyunk", "action": "A felvillanások előtti bizonytalan sötét kezdés. A sötét és a ritka felvillanások együtt legalább 60 másodpercet kapnak; ez egyelőre időzítési terv. Zenére villognak; klasszikus és indusztriális egyszerre. Bizalmatlan és kíváncsi, új és aggódó hangulat.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 254, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-X01", "section": "12 · Bábel világa", "title": "Elszigetelt felvillanások", "action": "A sötétben csak néhány rövid vonal jelenik meg; nem áll össze, nem engedem, hogy a néző bármit lásson benne.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 255, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-X02", "section": "12 · Bábel világa", "title": "Ritkán kijelölődik az út", "action": "A vonalpárok még távol állnak egymástól; csak később sűrűsödnek a korábbi folyosóvá, még csak egy absztrakt optikai ábra, nem konkrét forma.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 256, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F01", "section": "12 · Bábel világa", "title": "Üres vonalfolyosó", "action": "Elindulunk a sötétben felgyulladó függőlegesek között.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 257, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F02", "section": "12 · Bábel világa", "title": "Az ülő sorok között", "action": "A függőlegesek ívekké kapcsolódnak. Belépünk az ülő alakok közé.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 258, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F03", "section": "12 · Bábel világa", "title": "Oldalra nézünk: figyelnek", "action": "Előrébb haladunk és jobbra fordulunk. Három közeli alak felénk néz.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 259, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-X03", "section": "12 · Bábel világa", "title": "Balra pillantunk, az út kanyarodik", "action": "Az ülők közömbösen néznek ránk. A folyosó átvezet a kanyargó út formájába; enyhe megbillenés. Erősítve a bizonytalanságot.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 260, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F04", "section": "12 · Bábel világa", "title": "Szemből érkezik a menet", "action": "Visszafordulunk előre. A következő folyosószakaszon fekete alakok közelednek.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 261, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F05", "section": "12 · Bábel világa", "title": "Elengedjük őket magunk mellett", "action": "Balra húzódunk, jobbról elhalad a menet. Előttünk már látszik a tér.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 262, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F06", "section": "12 · Bábel világa", "title": "Megérkezünk a struktúrák közé", "action": "Balra járatok, jobbra magas homlokzat.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 263, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-X04", "section": "12 · Bábel világa", "title": "Konkrét ház, konkrét mozdulat", "action": "Egy felfüggesztett szobából fehér szálat adnak át egy lent várakozónak. Közben mások haladnak és figyelnek. Tipikus utcai jelenet is lehetne.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 264, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F07", "section": "12 · Bábel világa", "title": "A híd alól felnézünk", "action": "A bal oldali szerkezet alá lépünk. Fölöttünk emberek járnak és szálhálóban ülnek.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 265, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-X05", "section": "12 · Bábel világa", "title": "Leereszkedik a lépcső", "action": "A korábban bejárt tér mellett a semmiből ereszkedik le a lépcső.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 266, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F08", "section": "12 · Bábel világa", "title": "A hét főpap együtt leérkezik", "action": "Azonos ütemben lépnek le a lépcső utolsó fokairól. Főpapok? Valami vallási szekta?", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 267, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F09", "section": "12 · Bábel világa", "title": "A középső előrelép", "action": "A többiek megállnak, a középső közelebb lép hozzánk.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 268, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F10", "section": "12 · Bábel világa", "title": "Ránk mutat", "action": "Ránk mutat; hátrálni kezdünk.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 269, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-X06", "section": "12 · Bábel világa", "title": "Felülről ránk borul a kalitka", "action": "Felnézünk: a nyitott aljú szerkezet éppen fölénk ereszkedik. A következő képben már lezárt vonalak vesznek körül. Egy kalitka.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 270, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F11", "section": "12 · Bábel világa", "title": "Körénk zárult a kalitka", "action": "Belülről látjuk a zárt vonalakat, a papokat és a szomszédos foglyokat.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 271, "width": 1600, "height": 900, "image": "kepek/kepek-15.js"}, {"id": "babel-F12", "section": "12 · Bábel világa", "title": "A papok elvonulnak", "action": "A hét pap a háttérben álló lépcsőn visszamegy a saját vonalépületébe.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 272, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-X10", "section": "12 · Bábel világa", "title": "Körülnézünk a kalitkából", "action": "Más foglyok, vonalfák, járókelők és egy vonalakból rajzolt jármű látszik.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 273, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-R06", "section": "12 · Bábel világa", "title": "Másik irány a kalitkából", "action": "Jobbra fordulunk és leguggolunk. A szomszédos fogoly visszanéz, a vonaljármű távolodik.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 274, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-F13", "section": "12 · Bábel világa", "title": "Éjszaka: fekve nézzük a fekete eget", "action": "A kalitka talaján fekve nézzük a vonalágakat, a leveleket és a holdszerű testet. Testünk nem látszik.", "camera": "Fekvő szubjektív, felfelé az égre.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 275, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-X07", "section": "12 · Bábel világa", "title": "Másnap: újranyílik a lépcső, él a tér", "action": "A lépcső leereszkedik. Körülötte vonalfák, gép és néhány néző; a főpap fent jelenik meg. Talán reggel van. Talán nem.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 276, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-F14", "section": "12 · Bábel világa", "title": "Másnap visszatér a középső főpap", "action": "Egyedül áll a még zárt kalitkánk előtt.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 277, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-F15", "section": "12 · Bábel világa", "title": "Kinyitja és hív minket", "action": "Szabadon engednek; követjük a főpapot.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 278, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-X08", "section": "12 · Bábel világa", "title": "Vonalút a lépcsőhöz", "action": "Kilépünk a nyitott kalitkából, és a rajzolt úton követjük a főpapot a lépcsőig.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 279, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-F16", "section": "12 · Bábel világa", "title": "Közönség között felfelé", "action": "A szentélyen túli kanyargó lépcsőn a főpap mögött haladunk. A széleken és a pihenőkön sűrű közönség figyel; középen szabad az út.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 280, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-F17", "section": "12 · Bábel világa", "title": "Felfüggesztett vonalszobák munkatere", "action": "Zsúfolt munkatér. A nagy falak helyett fehér vázak vannak.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 281, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-F18", "section": "12 · Bábel világa", "title": "Építés: a munkás arca", "action": "A munkás felfelé figyeli a függő elemet, a másik feszesen tartja a vezetőszálat.", "camera": "Szubjektív közeli, a munka mellett.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 282, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-F19", "section": "12 · Bábel világa", "title": "Építés: a vonalak illesztése", "action": "Közelről nézzük a keret csomópontjának rögzítését.", "camera": "Szubjektív közeli, a munka mellett.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 283, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-F20", "section": "12 · Bábel világa", "title": "Építés: a torony magasabbra nő", "action": "Visszatérünk a szemből látott nézethez: a kapu fölött állványzat és spirállépcső emelkedik, fent még dolgoznak.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 284, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-F21", "section": "12 · Bábel világa", "title": "Elkészül, és a főpap felküld", "action": "A torony megtelik közlekedő emberekkel. A főpap a felső útvonalra mutat; a legfelső szakasz még üres.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 285, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-X09", "section": "12 · Bábel világa", "title": "Bizonytalanul az első foknál", "action": "Két közelről figyelő arc között megtorpanunk, majd elindulunk felfelé. Nem tudjuk, mit akarnak tőlünk.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 286, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-F22", "section": "12 · Bábel világa", "title": "Az első fordulóban", "action": "A lépcsőn állunk, a főpap lent marad. Oldalt ablak, fölöttünk folytatódik az út.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 287, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-F23", "section": "12 · Bábel világa", "title": "Első ablak: terítés két személyre", "action": "Egy szinttel feljebb balra nézünk. Egy asszony két személyre terít; észrevesz minket, megáll. Az egyik szék üres.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "Lépünk felfelé, majd visszanézünk az ablakra.", "number": 288, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-R01", "section": "12 · Bábel világa", "title": "Visszanézünk az előző szobára", "action": "Megtorpanunk: alattunk az előző ablak és a lent maradt főpap látszik. Megértjük, fel kell mennünk. Rajtunk kísérleteznek.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "Visszafordulunk és a következő emeletre lépünk.", "number": 289, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-U01", "section": "12 · Bábel világa", "title": "Második ablak: a végtelen szál", "action": "Egy emelettel feljebb jobbra nézünk. Két ember szálat bogoz; a szál a szobán és a székeken is átfut.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 290, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-U02", "section": "12 · Bábel világa", "title": "Harmadik ablak: torony a toronyban", "action": "Felérünk a következő pihenőre. Balra egy férfi Bábel kicsinyített mását építi.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A mozdulat irányát folytatjuk a következő képen.", "number": 291, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-U03", "section": "12 · Bábel világa", "title": "Felső ablak: valami minket néz", "action": "Magasabban egy sötét szobában fehér vonalakból álló szem figyel. A nézőpont a lépcsőn, az ablakon kívül marad.", "camera": "Szubjektív, gyerekmagasságú nézet.", "cut": "A szemről felnézünk a távoli fényre.", "number": 292, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-R03", "section": "12 · Bábel világa", "title": "Távoli korong a magasban", "action": "Felnézünk. Még nem értjük, napot, holdat vagy kijáratot látunk-e.", "camera": "Szubjektív felfelé nézés a lépcsőről.", "cut": "Megtorpanunk, lefelé pillantunk.", "number": 293, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-U04", "section": "12 · Bábel világa", "title": "Lenézünk a magasból", "action": "Több fordulóval feljebb lenézünk. A korlát vezeti a tekintetünket; lent aprók az emberek és a főpap.", "camera": "Szubjektív lenézés, közeli korláttal.", "cut": "Újabb emelkedés után ugyanabba az irányba nézünk le.", "number": 294, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-R02", "section": "12 · Bábel világa", "title": "Köztes magasság: zsugorodik a világ", "action": "Újabb forduló után az épületek kisebbek, az emberek már csak apró alakok.", "camera": "Szubjektív lenézés, közeli korláttal.", "cut": "Újabb emelkedés után ugyanabba az irányba nézünk le.", "number": 295, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-U05", "section": "12 · Bábel világa", "title": "Már csak pontok és vonalak", "action": "Még magasabbról a lenti világ pontokká és vékony vonalakká válik. Ritmikus mozgásuk az animációban következik.", "camera": "Szubjektív lenézés, közeli korláttal.", "cut": "A pontokról felfelé fordulunk.", "number": 296, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-R04", "section": "12 · Bábel világa", "title": "Megállunk a fordulóban", "action": "A fény továbbra is messze van. A lefelé vezető útra pillantunk, majd újra felfelé.", "camera": "Szubjektív felfelé nézés a lépcsőről.", "cut": "Óvatosan továbbmegyünk egy újabb fordulót.", "number": 297, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-R05", "section": "12 · Bábel világa", "title": "Felismerjük a nyílás szélét", "action": "Közelebb érünk. Először válik láthatóvá a szabálytalan perem és a lépcsőre eső fény.", "camera": "Szubjektív felfelé nézés a lépcsőről.", "cut": "A peremet megtartva közelítünk az utolsó fokokhoz.", "number": 298, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-U06", "section": "12 · Bábel világa", "title": "Az utolsó fokok, a fény nyílása", "action": "Visszanézünk felfelé. Az utolsó lépcsőfokok fölött ovális nyíláson valódi fény áramlik be. Ezen át jutunk ki.", "camera": "Szubjektív felfelé nézés a lépcsőről.", "cut": "Átbukunk a fényen; az esti búvóhelyre érkezünk.", "number": 299, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}, {"id": "babel-U07", "section": "13 · Vissza az esti játszótérre", "title": "Visszaérkezünk az esti játszótérre", "action": "A búvóhelyre érkezünk. Előtérben a sötét nyílás széle, benne az utolsó fokok; kint már este van.", "camera": "Homokszintű szubjektív az ülőperem alatt.", "cut": "Kitartjuk a visszaérkezést; a Holdvilág átvezetése következik.", "number": 300, "width": 1600, "height": 900, "image": "kepek/kepek-16.js"}]</script><script>
const shots=JSON.parse(document.getElementById('shots').textContent),main=document.getElementById('main'),jump=document.getElementById('jump');
function node(tag,text){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x;}
const imageData=new Map(),bundleLoads=new Map();
window.__filmRegisterImages=(name,entries)=>{for(const [id,data] of Object.entries(entries))imageData.set(id,data);};
function loadBundle(name){if(!bundleLoads.has(name))bundleLoads.set(name,new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=name;script.onload=resolve;script.onerror=()=>reject(new Error('A képcsomag nem tölthető be: '+name));document.head.append(script);}));return bundleLoads.get(name);}
async function showImage(im){try{await loadBundle(im.dataset.bundle);const data=imageData.get(im.dataset.shot);if(!data)throw new Error('Hiányzó kép: '+im.dataset.shot);im.src=data;}catch(error){im.alt+=' – A kép nem tölthető be.';console.error(error);}}
const imageObserver='IntersectionObserver' in window?new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){imageObserver.unobserve(entry.target);showImage(entry.target);}},{rootMargin:'1400px'}):null;
let section='';const fragment=document.createDocumentFragment();
for(const s of shots){
 if(s.section!==section){section=s.section;const heading=node('h1',section);heading.id='section-'+s.id;fragment.append(heading);const option=node('option',section);option.value=heading.id;jump.append(option);}
 const article=node('article');article.id=s.id;article.dataset.number=String(s.number);article.append(node('h2',String(s.number).padStart(3,'0')+' · '+s.title));
 const im=node('img');im.dataset.bundle=s.image;im.dataset.shot=s.id;im.alt=s.title;im.loading='lazy';im.width=s.width;im.height=s.height;if(imageObserver)imageObserver.observe(im);else showImage(im);article.append(im,node('p',s.action));
 const details=node('div');details.className='details';details.append(node('p','Kamera: '+s.camera),node('p','Vágás / átjutás: '+s.cut));article.append(details);fragment.append(article);
}
main.append(fragment);jump.onchange=()=>document.getElementById(jump.value)?.scrollIntoView({behavior:'smooth'});if(location.hash)document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script></body></html>
