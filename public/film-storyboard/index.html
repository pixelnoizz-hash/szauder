</style></head><body><nav aria-label="Jelenetek"><select id="jump" aria-label="Ugrás a film részéhez"><option value="">Ugrás…</option></select></nav><main id="main"></main><script id="shots" type="application/json">[{"id": "nyitas-R01", "section": "01 · Játszótér, bújócska és kristály", "title": "A hely", "action": "Nyugodt totál: homokozó, piros csúszda, fehér gömbmászóka, kék ív. A játszótér még teljesen valóságos és nyugodt.", "camera": "Lassan közelítő totál.", "cut": "A figyelem és a mozdulat irányát megtartva folytatjuk.", "number": 1, "width": 1600, "height": 893, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N01", "section": "01 · Játszótér, bújócska és kristály", "title": "Megérkezés", "action": "A kisfiú hátulról belép a játék terébe. Elindul a játék, a gyerekek szétszélednek.", "camera": "Gyerekmagasságú követés.", "cut": "A figyelem és a mozdulat irányát megtartva folytatjuk.", "number": 2, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N02", "section": "01 · Játszótér, bújócska és kristály", "title": "Elindul a számolás", "action": "Egy másik gyerek a fához fordul, és eltakarja a szemét. A kisfiú egy pillanatig vár, majd elindul.", "camera": "Váll mögötti közeli, a számoló arca takarásban.", "cut": "A figyelem és a mozdulat irányát megtartva folytatjuk.", "number": 3, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N02-snitt-4", "section": "01 · Játszótér, bújócska és kristály", "title": "Kéz a kérgen", "action": "Közelről látjuk a számoló kezét és kék kabátujját. Az arca takarásban marad, a többiek lépései távolodnak.", "camera": "Kéz- és fatörzsközeli.", "cut": "A távolodó lépések az első búvóhelyhez vezetnek.", "number": 4, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N08", "section": "01 · Játszótér, bújócska és kristály", "title": "A csúszda alatt", "action": "A másik fiú a piros csúszda alá kuporodik, és a csúszólap meg a tartólábak takarásából figyel.", "camera": "12 cm magas kamera a csúszda alatt; az alja átlósan zárja a képet.", "cut": "A figyelem és a mozdulat irányát megtartva folytatjuk.", "number": 6, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N09", "section": "01 · Játszótér, bújócska és kristály", "title": "A távoli fa takarásában", "action": "A kislány a homokozó túloldalán, a kék mászóív közelében egy másik fa mögé guggol. A számoló fiú messze, balra marad.", "camera": "Alacsony nézet a homokozóból; a törzs eltakarja a kislányt.", "cut": "A következő felső nézet megmutatja a búvóhelyek távolságát.", "number": 7, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N10", "section": "01 · Játszótér, bújócska és kristály", "title": "A lakótelepi ablakból", "action": "Magas, ferde rálátás: egyszerre látjuk a csúszda alatt, a fa mögött és a perem felé tartó gyereket. Feltárul a játék térképe.", "camera": "Lakótelepi ablakból lefelé néző totál; keret és párkány az előtérben.", "cut": "A figyelem és a mozdulat irányát megtartva folytatjuk.", "number": 8, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N04clean", "section": "01 · Játszótér, bújócska és kristály", "title": "A peremhez ér", "action": "A csíkos pulóveres fiú a homokozó belső oldalán a fa ülőperemhez fut. A többiektől külön búvóhelyet választ.", "camera": "Hátsó alacsony követés, az arc rejtve.", "cut": "Megáll a peremnél és letérdel.", "number": 10, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N06rim", "section": "01 · Játszótér, bújócska és kristály", "title": "Bemászik a búvóhelyre", "action": "A fiú térdre ereszkedik a fa ülőperemnél. A háttérben a többiek a csúszda és a távoli fa takarásában maradnak.", "camera": "Alacsony hátsó félközeli, a többiek kis méretben látszanak.", "cut": "A számoló indulását röviden ellenőrizzük, majd követjük a bemászást.", "number": 12, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N12", "section": "01 · Játszótér, bújócska és kristály", "title": "Véget ér a számolás – a hunyó elindul", "action": "Elhallgat a számolás. A hunyó leveszi a kezét a fáról, megfordul, és megteszi az első lépést a játszótér felé. A többiek már elbújtak.", "camera": "Hátsó háromnegyedes nézet a fától a játszótér felé.", "cut": "A figyelem és a mozdulat irányát megtartva folytatjuk.", "number": 13, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N11c", "section": "01 · Játszótér, bújócska és kristály", "title": "Bebújik – beljebb húzódik", "action": "A fiú könyökre ereszkedik, és hosszában beljebb kúszik a perem alá. Jobbra végig zárt fal húzódik, balra a homokozó felé nyitott a búvóhely, és a hosszanti vége is nyitva van.", "camera": "Új kamera a perem alatt, hátulról, hosszában a nyitott vég felé.", "cut": "A figyelem és a mozdulat irányát megtartva folytatjuk.", "number": 14, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N07d", "section": "01 · Játszótér, bújócska és kristály", "title": "Bentről kifelé", "action": "A fiú nézőpontja a perem alól: a többi gyerek már elbújt, a játszótér elcsendesedett. Jobbról zárt fal keretezi a képet.", "camera": "Alacsony szubjektív nézet a deszkák alól.", "cut": "A figyelem és a mozdulat irányát megtartva folytatjuk.", "number": 15, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-N13c", "section": "01 · Játszótér, bújócska és kristály", "title": "A hunyó közeledik", "action": "A kereső visszatér a homokozóhoz. A búvóhelyről csak a nadrágszárát, a cipőjét és a közeledő árnyékát látjuk. A kisfiú mozdulatlan marad.", "camera": "Homokszintű szubjektív a perem alól, felül fa, jobbra végig zárt fal.", "cut": "A figyelem és a mozdulat irányát megtartva folytatjuk.", "number": 16, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-K01", "section": "01 · Játszótér, bújócska és kristály", "title": "Kézzel ásunk", "action": "A búvóhelyen két kéz félresöpri a homokot. A sekély mélyedésből előbukkan egy fehér kristálydarab.", "camera": "Földközeli POV a csíkos pulóver ujjaival.", "cut": "A kéz megáll; a frissen előkerült kristályra közelítünk.", "number": 17, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-K02", "section": "01 · Játszótér, bújócska és kristály", "title": "Egyetlen kristály", "action": "Az élesség a fehér szemcsére vált. A természetes fény emeli ki; nem kezd mágikusan világítani.", "camera": "Homokszinti makró.", "cut": "A figyelem és a mozdulat irányát megtartva folytatjuk.", "number": 18, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-K03", "section": "01 · Játszótér, bújócska és kristály", "title": "A kristály belseje", "action": "A fehér kristály apró lapjait és a rátapadt homokszemeket nézzük. Az emberi lépték lassan eltűnik.", "camera": "Új, oldalról vett extrém makró; ember és kéz nélkül.", "cut": "A kristály lapjai a következő világ nagy szemcséiben folytatódnak.", "number": 19, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-K04", "section": "01 · Játszótér, bújócska és kristály", "title": "Felületből táj", "action": "A fehér szemcse anyaga piramisoldalként folytatódik. Jobbra feltűnik egy létra és egy zöld ruhás munkás cipője.", "camera": "Lassú hátrálás tervezett végfázisa, meglévő képalap.", "cut": "A figyelem és a mozdulat irányát megtartva folytatjuk.", "number": 20, "width": 1600, "height": 900, "image": "kepek/kepek-01.js"}, {"id": "nyitas-K05", "section": "01 · Játszótér, bújócska és kristály", "title": "Kibomlik a sivatagi világ", "action": "Feltárul a korábbi piramisos világ: jobbra ugyanaz a létra és ugyanaz a munkás. Innen folytatódik a már meglévő Blake-rész.", "camera": "Talajközeli nagylátószög, meglévő Dávid-képalap.", "cut": "A piramist és a jobb oldali létrát megtartva folytatjuk a Blake-világban.", "number": 21, "width": 1600, "height": 893, "image": "kepek/kepek-01.js"}, {"id": "blake-07", "section": "02 · Blake-világ", "title": "Oldalról a munkás mellett – szűk középkép", "action": "Balra a munkás profilja, jobbra a piramis fehér oldala. A kéz és a szerszám találkozását figyeljük. Egy rövid húzás után vékony lemez válik le.", "camera": "Oldalról a munkás mellett — szűk középkép", "cut": "Kézmozdulatra közelítünk vágással.", "number": 22, "width": 1600, "height": 893, "image": "kepek/kepek-01.js"}, {"id": "blake-08", "section": "02 · Blake-világ", "title": "Kézközeli", "action": "A munkás két ujja közé fogja a fehér lemezt, majd elengedi. A lemez néhány centit süllyed.", "camera": "Kézközeli", "cut": "Vágás még az esés befejezése előtt az olvasható oldalnézetre.", "number": 23, "width": 1600, "height": 893, "image": "kepek/kepek-01.js"}, {"id": "blake-09", "section": "02 · Blake-világ", "title": "Tágabb beállítás – a lemez lebegése", "action": "A lemez megáll a levegőben. A kéz kissé visszahúzódik. Rövid várakozás után a lemez felfelé indul.", "camera": "Tágabb beállítás — a lemez lebegése", "cut": "A munkás reakcióját keressük.", "number": 24, "width": 1600, "height": 893, "image": "kepek/kepek-01.js"}, {"id": "blake-10", "section": "02 · Blake-világ", "title": "A lemez a munkás fölé emelkedik", "action": "A munkás nyitott tenyere fölött végig látszik a vékony fehér lemez. A munkás felnéz rá; a lemez jobbra felfelé száll.", "camera": "Háromnegyedes középkép, a kéz, az arc és a lemez együtt.", "cut": "A lemez felfelé tartó mozgását tágabb képen folytatjuk.", "number": 25, "width": 1600, "height": 905, "image": "kepek/kepek-01.js"}, {"id": "blake-11", "section": "02 · Blake-világ", "title": "A munka folytatódik", "action": "A lemez a kép közepe fölé emelkedik. Balra a munkások tovább javítják a piramisokat; jobbra ugyanaz a földút vezet a különálló óriásfejhez.", "camera": "Tág térkép, a lemez és a két helyszín egy képen.", "cut": "Az úton jobbra haladunk a már megmutatott fejhez.", "number": 26, "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-12", "section": "02 · Blake-világ", "title": "Megérkezünk az óriásfejhez", "action": "Az út a fej talapzatához vezet. A jobb halántéknál már látszik a létra és a zöld kardigános festőnő. A piramisok mögöttünk, balra maradnak.", "camera": "Alacsony közeledő nézet, azonos oldalról.", "cut": "A már látható ecset mozdulatára vágunk közel.", "number": 27, "width": 1600, "height": 900, "image": "kepek/kepek-02.js"}, {"id": "blake-13", "section": "02 · Blake-világ", "title": "Az ecset hozzáér", "action": "A festőnő az állványon ecsettel megérinti a kőszemöldököt. Az arc még mozdulatlan.", "camera": "Közelebb a szemhez és az ecsethez.", "cut": "Az érintés helyén indul a következő reakció.", "number": 28, "width": 1600, "height": 900, "image": "kepek/kepek-02.js"}, {"id": "blake-14", "section": "02 · Blake-világ", "title": "Kinyílik a kőszem", "action": "A kőszem egy pillanatra életre kel, és a festőnő felé fordul. A száj sarka bosszús grimaszba húzódik.", "camera": "Oldalsó középkép; szem, száj és nő együtt.", "cut": "Az élő tekintetre a nő visszarándul.", "number": 29, "width": 1600, "height": 900, "image": "kepek/kepek-02.js"}, {"id": "blake-15", "section": "02 · Blake-világ", "title": "Megijed, de a helyén marad", "action": "A festőnő ugyanott, a létra felső fokain áll a fej jobb halántékánál. Egyik kezével kapaszkodik, az ecsetes kezét a homlok fölött megállítja, és a rá lenéző, élő kőszembe néz.", "camera": "Alulról fölfelé néző teleközeli; a nő nem kerül a szem magasságába vagy a talajra.", "cut": "A riadalom után ugyanonnan óvatosan újra a kőszemre pillant.", "number": 30, "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-16", "section": "02 · Blake-világ", "title": "Újra csak kő", "action": "A festőnő megvizsgálja a szemet: ismét tömör kő, a grimasz is eltűnt. Nem nyúl hozzá újra.", "camera": "Közeli megfigyelés, változatlan létra és fej.", "cut": "Rövid bizonytalanság után abbahagyja a munkát és lemászik.", "number": 31, "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-18", "section": "02 · Blake-világ", "title": "A következő út már látszik", "action": "A festőnő lelép a létrán. Balra a kőfej marad; jobbra már feltűnik a fehér cukordomb széle és a szemüveges cukortömb zöld szára.", "camera": "Alacsony tág oldalnézet, két helyszínnel.", "cut": "A cukordomb felé fordulva ugyanazon az ösvényen indulunk tovább.", "number": 33, "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-19", "section": "02 · Blake-világ", "title": "A fej mögül a szemüveges tárgy felé", "action": "A fej jobb oldala mellett haladunk tovább. Balra a tarkó faragott fürtjei maradnak; az ösvény végén, a fehér dűnék között már látszik a zöld száron álló szemüveges cukortömb.", "camera": "Talajközeli, jobbra forduló térfeltárás a fej mellett.", "cut": "A már megmutatott szemüveges tárgyhoz közelítünk; a következő kép ugyanaz a célpont.", "number": 34, "width": 1600, "height": 900, "image": "kepek/kepek-02.js"}, {"id": "blake-19A", "section": "02 · Blake-világ", "title": "Szemüveges cukor – alacsony totál", "action": "Egy görbe zöld száron álló fehér cukortömb szemüveget visel. Alatta apró járókelők haladnak. Megállunk; a lencse csillanása lassan változik.", "camera": "Szemüveges cukor — alacsony totál", "cut": "Az egyik lencséhez vágunk.", "number": 35, "width": 1600, "height": 893, "image": "kepek/kepek-02.js"}, {"id": "blake-19B", "section": "02 · Blake-világ", "title": "Ép szemüveg a magasban", "action": "A cukorfejen ugyanaz a két kerek, aranykeretes lencse látszik. A híd és a két szár összefüggő szemüveget alkot; a görbe zöld tartószárból látszik, hogy a tekintetünk még magasan jár.", "camera": "Alacsonyról felfelé néző közelítés; mindkét lencse a képen.", "cut": "A zöld száron lefelé billenünk, majd jobbra fordulunk a tükör tisztása felé.", "number": 36, "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-atvezetes-36a", "number": "36a", "section": "02 · Blake-világ", "title": "A szár tövétől a tükör tisztásáig", "action": "A bal szélen a zöld szár töve és az utolsó fehér cukorpart marad. Előttünk már a barna, poros tisztás és a sötét fasor látszik. Jobbra ugyanaz a szőke, zöld kabátos, piros harisnyás nő hajol a háromszögtükör fölé; előtte pocsolya.", "camera": "Alacsony, jobbra forduló tág POV; a tükör felé vezető földút látszik.", "cut": "Ugyanazon a barna talajon közelítünk a már megmutatott nőhöz és tükörhöz; a fasor a helyén marad.", "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-19C", "section": "02 · Blake-világ", "title": "Háromszögtükör – a kiinduló hely", "action": "Arany háromszögtükör áll a homokban. Balra a zöld kabátos, piros harisnyás alak hajol fölé; előttünk pocsolya. A tükörben ugyanez az alak térdel. Kivárjuk, amíg feltűnik az eltérés.", "camera": "Háromszögtükör — a kiinduló hely", "cut": "A térdelő alakra figyelve a felület felé közelítünk.", "number": 37, "width": 1600, "height": 893, "image": "kepek/kepek-02.js"}, {"id": "blake-19D", "section": "02 · Blake-világ", "title": "Belépés a háromszögbe", "action": "A ferde arany perem kifut a képből. Elhaladunk a térdelő alak mellett; ugyanaz a homok és ugyanaz a fény fogad. A kamera röviden lenéz a pocsolyára.", "camera": "Belépés a háromszögbe", "cut": "A pocsolya csillanása alatt rejtett illesztés, majd visszaemeljük a tekintetet.", "number": 38, "width": 1600, "height": 893, "image": "kepek/kepek-02.js"}, {"id": "blake-19E", "section": "02 · Blake-világ", "title": "A visszatérés feltárja az út szélét", "action": "A tükör ugyanoda hoz vissza. A hajoló alak és a pocsolya a helyén marad. A kamera lassan jobbra fordul; a jobb képszélen már feltűnik a távoli radírtorony keskeny széle.", "camera": "Alacsony folytonos jobbra fordulás a régi helyből, a tükör végig balra marad.", "cut": "A már feltűnt radír irányában folytatjuk a fordulást, és kitágítjuk a képet.", "number": 39, "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-atvezetes-39a", "number": "39a", "section": "02 · Blake-világ", "title": "A jobbra fordulás célja", "action": "Balra még a tükör és a pocsolya látszik. Jobbra teljes egészében feltárul a radírtorony, amelynek a széle az előző képen már megjelent; a kettőt ugyanaz a talaj és ugyanaz a horizont köti össze.", "camera": "A megkezdett jobbra fordulás tágabb folytatása.", "cut": "A radír tövében álló férfihez közeledünk; a tükör balra kicsúszik.", "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-19F", "section": "02 · Blake-világ", "title": "Radírtorony – földről felnézve", "action": "Fémhüvelyből magas fehér radír emelkedik, a tetején vörös fejkendős nő ül. Lent egy alak megáll a hüvelyre festett, széken ülő figura előtt. A két alsó szereplő nem két szobor: egyikük élő ember, a másik a festmény része.", "camera": "Radírtorony — földről felnézve", "cut": "Az alsó alak a festmény felé fordul; az ő kézmozdulatára közelítünk.", "number": 40, "width": 1600, "height": 893, "image": "kepek/kepek-02.js"}, {"id": "blake-19FA", "section": "02 · Blake-világ", "title": "Az ember megszólítja a festményt", "action": "Az élő, bézs kabátos férfi a hüvelyre festett nő felé fordítja nyitott tenyerét. Arca és tartása természetes; várja a választ.", "camera": "Oldalsó félközeli; férfi balra, festett nő jobbra.", "cut": "A férfi válla mellett a festett nő kezére fordulunk.", "number": 41, "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-19FB", "section": "02 · Blake-világ", "title": "Válasz a képből", "action": "A festett nő finoman felemeli a kezét. A képen belül marad; mögötte egy út és a távoli izzócipő látszik.", "camera": "A valódi férfi válla mögötti közeli.", "cut": "A lenti férfi fölfelé pillant; a radír tetején ülő nőhöz vágunk.", "number": 42, "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-19G", "section": "02 · Blake-világ", "title": "Fentről beleszól – lefelé mutató gesztus", "action": "A vörös kendős nő észreveszi a lenti párbeszédet. Előrehajol, lefelé, a festett képre mutat, majd kivár. Nem beszél, és nem hagyja el az ülőhelyét.", "camera": "Fentről beleszól — lefelé mutató gesztus", "cut": "Lefelé irányuló tekintetére visszavágunk a hüvely tövéhez.", "number": 43, "width": 1600, "height": 893, "image": "kepek/kepek-02.js"}, {"id": "blake-19GA", "section": "02 · Blake-világ", "title": "A festmény továbbenged", "action": "A széken ülő festett nő a mögötte futó útra mutat. Az úton már felismerhető az izzóból és cipőből álló tárgy. Az élő férfi félreáll.", "camera": "Ferde közeli a hüvely festett tájáról, a mutató kéz és az út együtt.", "cut": "A mutatás irányába, a szék mellett közeledünk a festményhez.", "number": 44, "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-atvezetes-44a", "number": "44a", "section": "02 · Blake-világ", "title": "Át a festmény szélén", "action": "A szék mellett haladunk a festett út felé. Balról még a radír fémhüvelyének görbülő pereme keretez; mögötte az út mélységet kap.", "camera": "Folyamatos, alacsony POV-közeledés.", "cut": "A hüvelyperem kifut balra; az út iránya nem változik.", "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-atvezetes-44b", "number": "44b", "section": "02 · Blake-világ", "title": "Bent vagyunk a tájban", "action": "A hüvely utolsó keskeny széle is mögöttünk marad. Előttünk, ugyanazon az úton, az áttetsző izzócipő jobbra lép.", "camera": "Talajközeli POV; cipőorr jobbra, város távol jobbra.", "cut": "A lépő tárgyhoz közelebb vágunk, megtartva a jobbra haladást.", "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-20", "section": "02 · Blake-világ", "title": "Izzóból és cipőből", "action": "A tárgy jobbra lép: az alja kopott cipő, a felső része áttetsző villanykörte csavaros rézfoglalattal. Benne egy nő utazik. Az izzó néha felizzik (ez a jelenlegi képen még nem látható).", "camera": "Talajközeli háromnegyedes teljes tárgy.", "cut": "A sarok emelkedése megbillenti a bent álló nőt.", "number": 45, "width": 1600, "height": 900, "image": "kepek/kepek-02.js"}, {"id": "blake-21", "section": "02 · Blake-világ", "title": "Az ép üvegen belül támaszkodik", "action": "Az izzócipő jobbra lép, a sarka megemelkedik. A nő mindkét tenyerével az ép, zárt üveg belső oldalának támaszkodik.", "camera": "Alacsony első háromnegyedes nézet, új szögből.", "cut": "A dőlő üvegen át a nő arcára közelítünk.", "number": 46, "width": 1600, "height": 905, "image": "kepek/kepek-02.js"}, {"id": "blake-22", "section": "02 · Blake-világ", "title": "Felméri a mozgást", "action": "A nő az üvegen át előre figyel. Meglepik a lépések; a látható izzószál és a csavaros foglalat egyértelművé teszi, mi ez a tárgy.", "camera": "Arcközeli az üvegen át.", "cut": "A következő lépésre visszahúzza a kezét és megtámaszkodik belül.", "number": 47, "width": 1600, "height": 905, "image": "kepek/kepek-03.js"}, {"id": "blake-24", "section": "02 · Blake-világ", "title": "Felveszi a lépések ritmusát", "action": "A nő visszahúzza a kezét, és stabilabban áll az izzóban. Együtt dől a jobbra lépő cipővel, és a város felé figyel.", "camera": "Félközeli, üvegtest és cipőtalp együtt.", "cut": "Jobbra tágítva a következő utazó tárgyat is meglátjuk.", "number": 49, "width": 1600, "height": 905, "image": "kepek/kepek-03.js"}, {"id": "blake-25", "section": "02 · Blake-világ", "title": "Visszanézés, a konzerv már látszik", "action": "Az izzócipőtől távolodva visszanézünk a nőre: a tenyere még az üvegen van. Jobbra, ugyanazon az útvonalon már látszik a konzervdoboz és a két férfi.", "camera": "Alsó háromnegyedes közös térkép; izzócipő balra, konzerv jobbra.", "cut": "A fémkoppanásra jobbra fordulunk; a konzerv végig ugyanott marad.", "number": 50, "width": 1600, "height": 900, "image": "kepek/kepek-03.js"}, {"id": "blake-25A", "section": "02 · Blake-világ", "title": "A két tárgy közös tere", "action": "Bal előtérben az izzócipő, jobbra a konzervdoboz. A nő lassan leengedi a kezét. A kék ruhás férfi lábujjhegyre állva eléri a doboz peremét; a krémszínű inges férfi fent áll, és a város felé mutat.", "camera": "Közös totál, változatlan tárgyméretekkel és helyekkel.", "cut": "A már azonosított kék ruhás férfi kapaszkodó kezére vágunk.", "number": 51, "width": 1600, "height": 900, "image": "kepek/kepek-03.js"}, {"id": "blake-26", "section": "02 · Blake-világ", "title": "Kinek a keze kapaszkodik?", "action": "A kék kabátujj, a kopasz fej széle és a vörös táskapánt alapján felismerjük a férfit. Két kézzel a konzervdoboz peremét fogja.", "camera": "Kéz- és peremközeli, kívülről.", "cut": "Kitágítunk: megmutatjuk, hogyan próbál feljutni és hol áll a lába.", "number": 52, "width": 1600, "height": 900, "image": "kepek/kepek-03.js"}, {"id": "blake-27", "section": "02 · Blake-világ", "title": "Nem sikerül felhúznia magát", "action": "A férfi a földről, lábujjhegyre emelkedve kapaszkodik, de a mellkasát nem tudja a perem fölé húzni. A fenti alak másfelé figyel.", "camera": "Alacsony egész alakos totál, a talajjal és a teljes konzervvel.", "cut": "A lent felnéző férfi tekintete a fent állóra vezet.", "number": 53, "width": 1600, "height": 900, "image": "kepek/kepek-03.js"}, {"id": "blake-28", "section": "02 · Blake-világ", "title": "A fenti ember nem segít", "action": "A krémszínű inges férfi továbbra is a városra mutat, és nem fordul a peremnél erőlködő férfi felé.", "camera": "Arc és mutató kar közös képe, a konzerv peremével.", "cut": "A segítség helyett kapott mutatás után visszanézünk az alsó alakra.", "number": 54, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-29", "section": "02 · Blake-világ", "title": "Abbahagyja az erőlködést", "action": "A kék ruhás férfi abbahagyja a húzódzkodást. Még tartja a peremet, majd oldalra fordítja a fejét, és másik utat keres.", "camera": "Félközeli, azonos kék ruha és vörös táskapánt.", "cut": "A fejfordulást látható oldallépéssel követjük a konzerv jobb oldala felé.", "number": 55, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-30", "section": "02 · Blake-világ", "title": "Megkerülve feltűnik a létra", "action": "A kamera jobbra mozdul. A konzervdoboz eddig takart oldalán láthatóvá válik egy odatámasztott létra. A férfi még a peremet fogja, de már a létrára néz.", "camera": "Oldalirányú térfeltárás; perem, férfi és létra egy képen.", "cut": "A földön támaszkodó férfi elengedi a peremet, és a létra talpához lép.", "number": 56, "width": 1600, "height": 900, "image": "kepek/kepek-03.js"}, {"id": "blake-31", "section": "02 · Blake-világ", "title": "Másik út fölfelé", "action": "A férfi a létrához lép. Kezét a létra oldalára teszi, egyik lábát az első fokra emeli; a vörös táskát magánál tartja.", "camera": "Alacsony középkép; létratalp, teljes alak és konzerv együtt.", "cut": "Ugyanazon a létrán követjük fölfelé, nem váltunk új tárgyra.", "number": 57, "width": 1600, "height": 900, "image": "kepek/kepek-03.js"}, {"id": "blake-atvezetes-57a", "number": "57a", "section": "02 · Blake-világ", "title": "Felér a peremhez", "action": "A férfi a felső fokokról átlép a konzervdoboz tetejére. A krémszínű inges férfi ugyanott áll, és továbbra is a város felé mutat.", "camera": "Tág oldalnézet, a teljes létra és a két férfi együtt.", "cut": "A befejezett feljutás után a mutatás irányába fordulunk.", "width": 1600, "height": 905, "image": "kepek/kepek-03.js"}, {"id": "blake-32", "section": "02 · Blake-világ", "title": "A mutatás célja: a város és a csiga", "action": "A kék ruhás férfi már fent áll a másik mellett. A konzervdoboz balra marad; a jobb oldali út távoli végén a város bejárata látszik. Ott egy zöld fazekat hordozó csiga halad át az úton.", "camera": "Tág térfeltárás ugyanarról az útról; konzerv, létra és városi célpont együtt.", "cut": "A konzervet hátunk mögött hagyva, ugyanazon az úton közeledünk a távoli csigához.", "number": 58, "width": 1600, "height": 905, "image": "kepek/kepek-03.js"}, {"id": "blake-atvezetes-58a", "number": "58a", "section": "02 · Blake-világ", "title": "Közeledés a város teréhez", "action": "Végighaladunk a földúton. A konzervdoboz már mögöttünk van; előttünk a városi tér bejárata és az úton átkelő csiga. A járókelők megállnak, hogy elengedjék.", "camera": "Talajközeli közeledő nézet, változatlan haladási iránnyal.", "cut": "A csiga balra tartó mozgását megtartva érünk a 59. kép közeli tértotáljába.", "width": 1600, "height": 900, "image": "kepek/kepek-03.js"}, {"id": "blake-32A", "section": "02 · Blake-világ", "title": "A csiga teljes alakja – megvárjuk", "action": "A csiga balra halad, a hátán sötétzöld, felfordított zománcfazék. A fazék tetején két alak áll. A város lakói nyugodtan elengedik maguk előtt.", "camera": "A csiga teljes alakja — megvárjuk", "cut": "A fej finom mozdulata közelit indokol.", "number": 59, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-32B", "section": "02 · Blake-világ", "title": "Csigaszemmagasság – találkozás", "action": "Alacsonyról nézzük a csiga fejét. Az egyik tapogatója lassan felénk fordul, majd vissza az út irányába. Nem rajzolunk belőle emberi arcot.", "camera": "Csigaszemmagasság — találkozás", "cut": "A fazék tetejéről halk koppanás hallatszik.", "number": 60, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-32C", "section": "02 · Blake-világ", "title": "A fazék mögül – körüljárás", "action": "Rövid, jól látható oldalmozgással a csiga hátsó háromnegyedéhez kerülünk. Meglátjuk a fazék tetején várakozó két embert; az egyik a másik csomagját igazítja. A csiga továbbhalad.", "camera": "A fazék mögül — körüljárás", "cut": "A fazék mögül szabaddá váló utcára nézünk.", "number": 61, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-32D", "section": "02 · Blake-világ", "title": "A csiga elenged – mögötte a csésze utcája", "action": "A csiga a bal előtérbe húzódik. Mögötte, jobbra, ugyanabban az utcában feltárul a fehér arcos csésze, a tetején vékony fekete füst. Kivárjuk, amíg szabad lesz az út.", "camera": "A csiga elenged — mögötte a csésze utcája", "cut": "A füstös csésze egészére vágunk.", "number": 62, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-32E", "section": "02 · Blake-világ", "title": "Arccsésze – közös utcai totál", "action": "A csésze arca balra néz, a füle jobbra nyílik. A repedésében aranylánc fut a tetejétől a kövezetig. Lent két ember, fent kis tűz és két alak; először együtt látjuk őket.", "camera": "Arccsésze — közös utcai totál", "cut": "A lánc alsó végéhez közelítünk.", "number": 63, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-32F", "section": "02 · Blake-világ", "title": "A lánc lábánál", "action": "Az okkerszínű ruhás, ülő férfi felnéz a könyvéből. A zöld ruhás nő a földre futó láncot figyeli; az egyik láncszem enyhén megfeszül, majd elernyed.", "camera": "A lánc lábánál", "cut": "A lánc mentén felfelé irányuló tekintethez vágunk.", "number": 64, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-32G", "section": "02 · Blake-világ", "title": "A csésze tetején – kis tűz, nyugodt emberek", "action": "Fent a zöld ruhás nő megáll a repedésnél. Mögötte kis tűz ég, mellette egy bottal álló férfi és egy fekvő állat. A füst felfelé száll, mindenki nyugodt.", "camera": "A csésze tetején — kis tűz, nyugodt emberek", "cut": "Visszatérünk utcai magasságba: a füst mögött először a csésze széle, majd a cipős utca válik olvashatóvá.", "number": 65, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-33", "section": "02 · Blake-világ", "title": "Utcai alacsony nagytotál", "action": "A járókelők kerülgetik az óriási cipőt. A kamera megáll a túloldalra tartó emberek előtt; a forgalomnak ritmusa van.", "camera": "Utcai alacsony nagytotál", "cut": "Egy járókelő megtorpanására közelítünk.", "number": 66, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-34", "section": "02 · Blake-világ", "title": "Cipőorr és járókelő – középkép", "action": "Egy járókelő óvatosan megérinti a cipő kopott orrát, majd továbbmegy. A hatalmas cipő mozdulatlan marad.", "camera": "Cipőorr és járókelő középkép", "cut": "A járókelő kilépése szabaddá teszi az utat.", "number": 67, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-35", "section": "02 · Blake-világ", "title": "Az eredeti teregető a főtéren", "action": "Balra asszonyok csúszdáznak. Középen a zöld lámpásfejű, fekete kabátos alak apró lépésekkel igazítja a maga előtt lógó fehér ruhákat. A telefonházba járókelők járnak ki-be.", "camera": "Az eredeti főtéri nagytotál, változatlan karakterrel.", "cut": "A csúszdázókhoz közelítünk, a teregetés közben folytatódik.", "number": 68, "width": 1600, "height": 893, "image": "kepek/kepek-03.js"}, {"id": "blake-35A", "section": "02 · Blake-világ", "title": "A csúszdázás körforgása", "action": "Az egyik asszony lecsúszik, a másik lent feláll és félrelép, a harmadik fent elindul. Ugyanazok az asszonyok újra és újra visszakerülnek a sor elejére.", "camera": "Alacsony közeli a sima facsúszda lábánál.", "cut": "Az asszony fölfelé néz a leereszkedő ingre; vele nézünk fel.", "number": 69, "width": 1600, "height": 905, "image": "kepek/kepek-03.js"}, {"id": "blake-35B", "section": "02 · Blake-világ", "title": "Újabb ing érkezik", "action": "A gerendáról fehér ing ereszkedik az óriás felé. Az anyag enyhén leng, a kötelek útja végig követhető.", "camera": "Alulnézet az ing és a gerenda alatt.", "cut": "Az ereszkedő inget a megérkező kézig követjük.", "number": 70, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-35C", "section": "02 · Blake-világ", "title": "A zöld lámpásfejű tereget", "action": "Ugyanaz a zöld lámpásfej, fekete kabát, kék harisnya és barna cipő, mint a referenciaképen. A fehér ruhák előtte lógnak, nem a fejét takaró csuklyaként. A leereszkedő inget a maga előtt kifeszített kötélre akasztja.", "camera": "Közelebbi alacsony oldalnézet; az eredeti fej és az ingeket igazító kéz együtt.", "cut": "A felakasztott ing szegélyéhez közelítünk.", "number": 71, "width": 1600, "height": 905, "image": "kepek/kepek-04.js"}, {"id": "blake-36", "section": "02 · Blake-világ", "title": "Ruhaszegély közelije", "action": "Egy fehér homokszem kiszabadul a szegély hajtásából.", "camera": "Ruhaszegély közelije", "cut": "Az esés irányára vágunk a földhöz.", "number": 72, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-37", "section": "02 · Blake-világ", "title": "Talajmakró – új kép", "action": "A szemcse a kövezetre hullik, egyet pattan, és megáll.", "camera": "Talajmakró — új kép", "cut": "Rövid késés után reakcióarc.", "number": 73, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-38", "section": "02 · Blake-világ", "title": "Járókelő arcközelije", "action": "A járókelő lenéz, aztán lassan felpillant. Nincs rémület az arcán, csak figyelem.", "camera": "Járókelő arcközelije", "cut": "Tekintetirány a mérlegre.", "number": 74, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-39", "section": "02 · Blake-világ", "title": "A tér ritmusa folytatódik", "action": "A nagy deszka kissé megbillen. Az asszonyok tovább csúszdáznak, az óriás tereget, a telefonház körül folyamatos a ki-be járás.", "camera": "Visszatérő nagytotál, ugyanazzal a térelrendezéssel.", "cut": "A háttér telefonháza felé indulunk, elhaladva a csúszda és az óriás mellett.", "number": 75, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-40", "section": "02 · Blake-világ", "title": "A tér végén álló telefon", "action": "A tér hátsó részén a telefonházhoz érünk. Mögötte a város homlokzatai látszanak; a csúszda és az óriás már mögöttünk, a képen kívül marad. Emberek járnak ki-be az ajtaján.", "camera": "Alacsony közeledés a telefonhoz.", "cut": "Ugyanezen az oldalon tágabb képen feltárjuk a telefon teljes homlokzatát.", "number": 76, "width": 1600, "height": 905, "image": "kepek/kepek-04.js"}, {"id": "blake-41", "section": "02 · Blake-világ", "title": "Lakott telefonház", "action": "Látjuk a telefon teljes homlokzatát, körülötte a városi épületekkel. A kívül mászók és a belső szintek lakói lassan mozognak.", "camera": "Frontálisabb tág nézet, a városból érkező irányban.", "cut": "A külső létrán kapaszkodó kézhez közelítünk.", "number": 77, "width": 1600, "height": 905, "image": "kepek/kepek-04.js"}, {"id": "blake-41A", "section": "02 · Blake-világ", "title": "Kéz a telefon arany peremén", "action": "A külső létrán álló alak a peremet fogja. Fent, a hangszórónál egy fehér ruhás alak vár. Megnézzük, milyen furcsa épületben dolgoznak.", "camera": "Kéz a telefon arany peremén", "cut": "A függőleges létra iránya a belső polcokhoz vezet.", "number": 78, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-41B", "section": "02 · Blake-világ", "title": "A belső polcok lakói", "action": "A vörös kabátos alak a keretnél vár, a krémszínű ruhás nő megérinti a szélét. Alattuk a kék ruhás figura felnéz. Egyszerre mindig csak egy mozdulat történik.", "camera": "A belső polcok lakói", "cut": "Lefelé vezető létra és hang az alsó szobához hív.", "number": 79, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-42", "section": "02 · Blake-világ", "title": "A telefon alsó szobájának küszöbén", "action": "A figyelmet lefelé, az alsó lakott rekeszhez vezetjük. Előttünk még a sötét telefonperem és az arany küszöb; bent két ülő alak, létra, kis asztal és ajtó. Várunk, majd belépünk.", "camera": "A telefon alsó szobájának küszöbén", "cut": "A perem takarásában beljebb jutunk, és visszanézünk a főtérre.", "number": 80, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-42A", "section": "02 · Blake-világ", "title": "Visszatekintés a telefonból", "action": "A telefon belsejéből az ellenkező irányba, kifelé nézünk: a városi utcát és a homlokzatokat látjuk. Az előtérben álló ajtókeret jelzi, honnan nézünk.", "camera": "Belső ellenbeállítás, az ajtónyíláson át.", "cut": "Az ajtótól a belső asztal felé fordulunk.", "number": 81, "width": 1600, "height": 905, "image": "kepek/kepek-04.js"}, {"id": "blake-43", "section": "02 · Blake-világ", "title": "Jobbra fordulás – az asztal és a tükör tere", "action": "A bejárattól jobbra fordulunk. Két egymás mellé tolt asztalon balra egy kendővel letakart talpas pohár, jobbra egy ovális tükör áll. Előbb megismerjük a helyüket, aztán észrevesszük, hogy a pohárban egy cipő van.", "camera": "Jobbra fordulás — az asztal és a tükör tere", "cut": "A cipő apró mozdulata a 44-es részletre vezet.", "number": 82, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-44", "section": "02 · Blake-világ", "title": "Cipő és folyadék közelije", "action": "Egy apró lábmozdulattól gyűrű fut végig a folyadék felszínén. A láb újra megáll.", "camera": "Cipő és folyadék közelije", "cut": "Felfelé pillantás a kendő széléhez.", "number": 83, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-45", "section": "02 · Blake-világ", "title": "Kendőszél közelije", "action": "A kendő kissé megemelkedik. Arcot várunk, de csak sötét rés látszik, aztán a kendő visszahullik.", "camera": "Kendőszél közelije", "cut": "Vissza az egész tárgyra.", "number": 84, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-46", "section": "02 · Blake-világ", "title": "Oldalról az asztal mellett – a pohártól a tükörig", "action": "Az asztal mellől nézünk vissza a megnyugodott pohárra. A pohár az előtérben marad, a tükör mélyebben, jobbra látszik. A tükör mellé kötött szalag felől légáramlat érkezik.", "camera": "Oldalról az asztal mellett — pohártól a tükörig", "cut": "A tükörhöz vágunk, megtartva a bal–jobb helyzeteket.", "number": 85, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-48", "section": "02 · Blake-világ", "title": "Az asztal rendje megmarad", "action": "Az előző képpel azonos asztalon a pohár balra, elöl marad, az ovális tükör mélyebben, jobbra. A tükörben ég és felhő látszik, a mellette lévő szalag megmozdul.", "camera": "Ferde közeli az asztal hosszában, változatlan bal–jobb renddel.", "cut": "A jobb oldali tükörben megnyíló ég felé közelítünk.", "number": 86, "width": 1600, "height": 905, "image": "kepek/kepek-04.js"}, {"id": "blake-50", "section": "02 · Blake-világ", "title": "A tükör kerete kifut – érkezés az égbe", "action": "Közel kerülünk az éghez, de az arany keret keskeny szélei még jelzik, hogy tükörbe nézünk. A keret lassan kifut a képből. Néhány pillanatig csak a felhőt látjuk.", "camera": "A tükör kerete kifut — égbe érkezés", "cut": "Ég–ég illesztés után lefelé billenünk a dombtetőhöz.", "number": 87, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-51", "section": "02 · Blake-világ", "title": "Részleges felfedezés – kerék az ég alatt", "action": "A lefelé billenés végén még nem látjuk az egész szerkezetet. A képszélen feltűnik egy kerék és egy felfelé futó létra alsó része. Megállunk, és meghalljuk a fa nyikorgását.", "camera": "Részleges felfedezés — kerék az ég alatt", "cut": "Tágabb oldalnézet tárja fel, mihez tartozik a kerék.", "number": 88, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-52", "section": "02 · Blake-világ", "title": "Ketten a kerekes létránál", "action": "A zöld ruhás nő a létra tetején ül, lent a fehér inges férfi a kötelet tartja. Hosszan figyelik egymást; a szerkezet finoman egyensúlyoz.", "camera": "Eredeti oldaltotál, kitartott találkozás.", "cut": "A nő lefelé irányuló tekintetére közelítünk.", "number": 89, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-atvezetes-89a", "number": "89a", "section": "02 · Blake-világ", "title": "A nő lenéz rá", "action": "A létra tetején ülő nő a férfit figyeli. A tekintete meglágyul, alig észrevehetően mosolyog, és várja a választ.", "camera": "Arcközeli felhőháttérrel, tekintet lefelé-balra.", "cut": "Tekintetirány-vágás a lent álló férfira.", "width": 1600, "height": 905, "image": "kepek/kepek-04.js"}, {"id": "blake-atvezetes-89b", "number": "89b", "section": "02 · Blake-világ", "title": "A férfi válaszol", "action": "A fehér inges férfi felnéz a nőre. Felemeli szabad kezét, a másikkal még a kötelet tartja. A tekintetük összekapcsolódik.", "camera": "Arcközeli, tekintet felfelé-jobbra.", "cut": "A kéz elcsendesülése után a kerék mozdulatához térünk vissza.", "width": 1600, "height": 905, "image": "kepek/kepek-04.js"}, {"id": "blake-53", "section": "02 · Blake-világ", "title": "Kerék és föld közelije", "action": "A kerék megáll, majd kicsit továbbfordul. Alatta vékony, világos rés jelenik meg.", "camera": "Kerék és föld közelije", "cut": "Vissza ugyanabba az oldaltotálba.", "number": 90, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-54", "section": "02 · Blake-világ", "title": "Elemelkedés – a férfi a földön marad", "action": "A kocsi a rögzített létrával együtt lassan elemelkedik. A férfi lent marad, és elengedi a kötelet; a nő fent ül. A kamera még a dombtetőről figyel.", "camera": "Elemeledés — a férfi már a talajon", "cut": "A fenti nő tekintetére vágunk.", "number": 91, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-55", "section": "02 · Blake-világ", "title": "A fenti nő arcközelije", "action": "A zöld ruhás nő röviden lenéz a kamerába, aztán a felhők felé fordítja a tekintetét.", "camera": "A fenti nő arcközelije", "cut": "Tekintetirány a nyitott éghez.", "number": 92, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-56", "section": "02 · Blake-világ", "title": "A nő továbbra is ül", "action": "A felhők előtt a létra felső része és a rajta ülő zöld ruhás nő látszik. A szerkezet egyenletesen emelkedik; a nő nem áll fel.", "camera": "Alacsony, ég felé néző középkép.", "cut": "A létra emelkedését megtartva magasabb nézetre vágunk.", "number": 93, "width": 1600, "height": 905, "image": "kepek/kepek-04.js"}, {"id": "blake-57", "section": "02 · Blake-világ", "title": "Magas háromnegyedes nézet – a talaj már alattunk", "action": "Fentről látjuk a repülő szerkezetet. A nő fent marad, a férfi lent, az út egyre kisebb lesz. Itt válik igazán érzékelhetővé, milyen magasra emelkedtünk.", "camera": "Magas háromnegyedes nézet — a talaj már alattunk", "cut": "A létra alsó-bal / felső-jobb irányát megtartva a tenger fölötti távoli képre vágunk.", "number": 94, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-58", "section": "02 · Blake-világ", "title": "A felhő alatt megnyílik a tenger", "action": "A szerkezet továbbra is a levegőben van, nem ér vissza a földre.", "camera": "A felhő alatt megnyílik a tenger", "cut": "A haladás irányát megtartva belépünk a felhőbe; a régi világot teljesen eltakarja a pára.", "number": 95, "width": 1600, "height": 893, "image": "kepek/kepek-04.js"}, {"id": "blake-59", "section": "02 · Blake-világ", "title": "Felhő belseje – szubjektív tér", "action": "Elefántcsontszínű pára vesz körül. Mélyebben korall- és szürke színű, tapinthatónak tűnő felhőtömegek jelennek meg türkiz fényben. A világ stílusa a takarás alatt megváltozik.", "camera": "Felhő belseje — szubjektív tér", "cut": "A kamera lefelé billen; a következő kép korall és szürke felhői az előző tér folytatásai.", "number": 96, "width": 1600, "height": 900, "image": "kepek/kepek-04.js"}, {"id": "blake-60", "section": "02 · Blake-világ", "title": "Szubjektív zuhanás – lefelé néző kamera", "action": "A felhők elhaladnak mellettünk. Lent korallszínű talaj, színes golyók és játéktankok közelednek. A szemlélő teste nem látszik.", "camera": "POV zuhanás — lefelé néző kamera", "cut": "A lefelé mozgás lassul, a kamera a talaj közelében előrebillen a fekvő figura felé. A két kép között animált fékezés szükséges, nem puszta kemény vágás.", "number": 97, "width": 1600, "height": 900, "image": "kepek/kepek-04.js"}, {"id": "blake-61", "section": "02 · Blake-világ", "title": "A játékvilág talaján", "action": "A türkiz ruhás, kerek szemüveges figura a golyók és a játéktankok között fekszik. Figyelmünk az egyik kék üveggolyóra szűkül.", "camera": "Talajszinti POV, majd lassú közeledés a golyóhoz.", "cut": "Lassú, talajszinti ráközelítés az előttünk fekvő kék üveggolyóra.", "number": 98, "width": 1600, "height": 900, "image": "kepek/kepek-04.js"}, {"number": "98a", "section": "02 · Blake-világ", "id": "blake-atvezetes-98a", "title": "Bele a kék üveggolyóba", "action": "A kék üveggolyó körvonala szinte kitölti a képet. Mögötte elmosódik a türkiz ruha és a játéktank: minden figyelmünk a kék üvegre összpontosul.", "camera": "Talajszintű makró, lassú optikai közelítés; a golyó középen.", "cut": "A kék körön és annak bal felső fényén illesztünk; innen indul a kitágítás.", "width": 1600, "height": 905, "image": "kepek/kepek-05.js"}, {"number": "98b", "section": "03 · Háború", "id": "war-atvezetes-98b", "title": "Ugyanarról a golyóról kitágítunk", "action": "A kék golyó ugyanott marad, miközben távolodunk tőle. A képszélen megjelenik a türkiz és a rózsaszín kötött gyerek térde és keze, mögöttük a homokozó.", "camera": "Alacsony közelkép, lassú kitágítás a golyóról a két gyerek felé.", "cut": "A kitágítást megszakítás nélkül folytatjuk a két gyerek közös képéig.", "width": 1600, "height": 905, "image": "kepek/kepek-05.js"}, {"id": "war-02", "section": "03 · Háború", "title": "Két gyerek játszik", "action": "Két textilből készült, maszkarcú gyerek ugyanabban a játékvilágban a kék golyóval játszik. A tankok és a homok körülöttük maradnak.", "camera": "Alacsony közös kép a gyerekek és a golyó között.", "cut": "A két gyerek játékmozdulatát a játszótér tágabb képén folytatjuk.", "number": 100, "image": "kepek/kepek-05.js", "width": 1600, "height": 895}, {"id": "war-03", "section": "03 · Háború", "title": "Feltárul a közös játék", "action": "A két kötött maszkos gyerek között a kék golyó és a kis szemüveges figura fekszik. A háttér az eredeti játszótér: piros csúszda, fehér gömbmászóka és kék ív.", "camera": "Folyamatos emelkedés a homokszintről a két gyerek közös képéig.", "cut": "A golyó gurulásával közös játék indul.", "number": 101, "width": 1600, "height": 896, "image": "kepek/kepek-05.js"}, {"id": "war-04", "section": "03 · Háború", "title": "Még közös játék", "action": "A két gyerek egymásnak gurítja a golyót. A szemüveges játékfigura a jobb oldalon fekszik.", "camera": "Alacsony közös kétalakos kép.", "cut": "A közös golyó mellé külön saját figurákat választanak.", "number": 102, "image": "kepek/kepek-05.js", "width": 1600, "height": 895}, {"id": "war-05", "section": "03 · Háború", "title": "Két oldal, két figura", "action": "Balra a türkiz gyerek kis zöld tankot tesz le, jobbra a rózsaszín felállítja a szemüveges játékfigurát.", "camera": "Közös kép a két lerakó kézzel.", "cut": "A két játéktér közé határt húznak.", "number": 103, "image": "kepek/kepek-05.js", "width": 1600, "height": 895}, {"id": "war-06", "section": "03 · Háború", "title": "A határ szabálya", "action": "A homokba húzott vonal két oldalt választ el. A rózsaszín nyitott tenyérrel megállítja a határon átnyúló kezet.", "camera": "Felső közeli a vonalról és a kezekről.", "cut": "A gesztus után a maszkok reakciójára vágunk.", "number": 104, "image": "kepek/kepek-05.js", "width": 1600, "height": 895}, {"id": "war-07", "section": "03 · Háború", "title": "Komollyá válik", "action": "A gyerekek keze megáll. A bal maszk vörös szemnyílása zárva, a másik csuklyája feszesebb.", "camera": "Közeli kétalakos kép, arcok takarva.", "cut": "A záródás a tank fedelének mozdulatában folytatódik.", "number": 105, "image": "kepek/kepek-05.js", "width": 1600, "height": 895}, {"id": "war-08", "section": "03 · Háború", "title": "Becsukódik a tank fedele", "action": "A játéktank fedőlapja bezárul. A gyerek ujjai és a homokozó pereme még jelzik a kis méretet.", "camera": "Tankfedél-makró.", "cut": "A fedél koppanásával a kamera leereszkedik a tank mellé.", "number": 106, "image": "kepek/kepek-05.js", "width": 1600, "height": 895}, {"id": "war-09", "section": "03 · Háború", "title": "Lesüllyedünk a játékba", "action": "A tank lánctalpa már fölénk magasodik. Fent még látható a perem és a gyerek ujjai; előttünk a szálak tájjá válnak.", "camera": "Lefelé mozduló POV a lánctalp magasságáig.", "cut": "A perem kikerül a képből; ugyanazon az úton megyünk tovább.", "number": 107, "image": "kepek/kepek-05.js", "width": 1600, "height": 905}, {"id": "war-10", "section": "03 · Háború", "title": "Elindul a tank", "action": "A zöld tank jobbra halad, mögötte a kis katonák. A rózsaszín dombok az erdei út szélén állnak.", "camera": "Talajközeli oldalirányú követés.", "cut": "A következő dombok elzárják az útját.", "number": 108, "image": "kepek/kepek-05.js", "width": 1600, "height": 905}, {"id": "war-11", "section": "03 · Háború", "title": "Szájak nyílnak a dombokon", "action": "A rózsaszín kötött dombok fogas nyílásai a tank felé fordulnak. A menet megáll.", "camera": "Alsó háromnegyedes kép az akadállyal.", "cut": "A megtorpanásra a játszó gyerek keze belép a tájba.", "number": 109, "image": "kepek/kepek-05.js", "width": 1600, "height": 905}, {"id": "war-12", "section": "03 · Háború", "title": "Az ujjak megmutatják", "action": "Az óriási gyerekkéz két ujjal lépked a tank mellett. A tank számára új mozgást mutat.", "camera": "POV a talajon, kéz és tank együtt.", "cut": "Az ujjak lépése a tank lábaiban folytatódik.", "number": 110, "image": "kepek/kepek-05.js", "width": 1600, "height": 895}, {"id": "war-13", "section": "03 · Háború", "title": "A tank átlép", "action": "A tank lábakat növeszt és átlépi a rózsaszín akadályt. A katonák a túloldalt figyelik.", "camera": "Alacsony oldalnézet, az átlépő lábakkal.", "cut": "Az út felszabadul; a golyót egy katona viszi vissza.", "number": 111, "image": "kepek/kepek-05.js", "width": 1600, "height": 905}, {"id": "war-14", "section": "03 · Háború", "title": "Visszagurítják a golyót", "action": "Egy kis katona a türkiz ruhás gyerek várakozó ujjai felé gurítja a kék golyót.", "camera": "Golyóközeli POV, katona és óriás ujjak együtt.", "cut": "Mielőtt célba érne, a következő képen a rózsaszín kéz közbelép.", "number": 112, "image": "kepek/kepek-05.js", "width": 1600, "height": 905}, {"id": "war-15", "section": "03 · Háború", "title": "A kéz", "action": "B rózsaszín mandzsettás óriáskeze felülről benyúl, közvetlenül elveszi a kék golyót A katonájától, és visszateszi a vonalra. Ugyanaz a puszta kézzel való beavatkozás, amelyet B korábban megtiltott. A katona üres karja a levegőben marad.", "camera": "Alulnézet a katona szeméből", "cut": "INNENTŐL NINCS KÖZÖS KÉP.", "number": 113, "width": 1600, "height": 900, "image": "kepek/kepek-05.js"}, {"id": "war-16", "section": "03 · Háború", "title": "A", "action": "A megdermed. A maszk semmit nem mutat, a keze áll meg a levegőben.", "camera": "Egyes kép: A balról, tekintete jobbra", "cut": "Tekintetirány-vágás.", "number": 114, "width": 1600, "height": 900, "image": "kepek/kepek-05.js"}, {"id": "war-17", "section": "03 · Háború", "title": "B", "action": "B keze már az ölében. Nem néz vissza.", "camera": "Egyes kép: B jobbról, tekintete balra", "cut": "Vágás a lecsapó tenyérre.", "number": 115, "width": 1600, "height": 900, "image": "kepek/kepek-05.js"}, {"id": "war-18", "section": "03 · Háború", "title": "Az ütés", "action": "A tenyere lecsap B várára.", "camera": "Alulnézet: felülről lecsapó tenyér", "cut": "Az ütés a vár omlásában folytatódik.", "number": 116, "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-19", "section": "03 · Háború", "title": "A vár összedől", "action": "B várfala összeroskad. A szemüveges, türkiz testű figura a romokból az előtérbe esik; egy karja leválik és mellette áll meg. A szemüveg és a test egyetlen jól azonosítható tárgyé. A por elül.", "camera": "Alacsony totál B oldalán, rögzített", "cut": "Vágás B-re.", "number": 117, "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-20", "section": "03 · Háború", "title": "B felnéz", "action": "B lehajol, és a kép alsó szélén a törött szemüveges figurát és a levált kart összeszedi. Az ölébe teszi őket. Lassan felemeli a fejét, két keze a homokba markol; egyetlen lassú közelítés.", "camera": "Egyes kép B, egyetlen lassú dolly-in", "cut": "A markolásból előrelökés, abból füst.", "number": 118, "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-21", "section": "03 · Háború", "title": "Előrelöki", "action": "B két tenyérrel A felé löki a homokot.", "camera": "Egyes kép B, félközeli", "cut": "A lökés füstként érkezik.", "number": 119, "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-atvezetes-119a", "number": "119a", "section": "03 · Háború", "title": "A homok felcsap", "action": "A rózsaszín gyerek lökésétől a bézs kötött homok a kamera felé csap. A porban rózsaszín szálak jelennek meg.", "camera": "Talajközeli POV közvetlenül a lökő kéz előtt.", "cut": "A felhő betakarja a homokozót; benne megváltozik az anyag.", "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-atvezetes-119b", "number": "119b", "section": "03 · Háború", "title": "A porból rózsaszín köd", "action": "A bézs szemcsék rózsaszín gyapjúszálakká válnak. A köd balra elvékonyodik, mögötte a zöld tank és a kötött erdő jelenik meg; az első szem kinyílik.", "camera": "Alacsony POV a felhő belsejéből.", "cut": "A köd továbbvonul, és teljesen feltárja a következő harcteret.", "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-22", "section": "03 · Háború", "title": "Rózsaszín", "action": "Rózsaszín füsttest hömpölyög jobbról balra, és szemek nyílnak benne.", "camera": "Nagytotál, kézikamera", "cut": "Ellenirány.", "number": 120, "width": 1600, "height": 905, "image": "kepek/kepek-06.js"}, {"id": "war-23", "section": "03 · Háború", "title": "Kék", "action": "Kék füst tolul vele szemben, a kettő egymásnak feszül.", "camera": "Nagytotál, kézikamera", "cut": "—", "number": 121, "width": 1600, "height": 905, "image": "kepek/kepek-06.js"}, {"id": "war-24", "section": "03 · Háború", "title": "Árok", "action": "A kék–zöld katonái a korábban játékosan bejárt pálya most felszakadt szegélyéből kialakult lövészárokba húzódnak. A rózsaszín támadás földet sodor rájuk.", "camera": "Talajszint, kézikamera", "cut": "—", "number": 122, "width": 1600, "height": 905, "image": "kepek/kepek-06.js"}, {"id": "war-26", "section": "03 · Háború", "title": "Roham", "action": "B vörös színjelű serege a füst fedezékében jobbról balra áttöri A ismert zöld pályájának szélét. A tankja megtorpan előttük. Az áttörés váltja ki A következő ökölcsapását.", "camera": "Totál, kísérő mozgás", "cut": "Vágás A-ra.", "number": 123, "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-27", "section": "03 · Háború", "title": "Ökölcsapás", "action": "A türkiz gyerek teljes erőből a homokba csap; a homok megemelkedik a keze körül.", "camera": "Alacsony közeli az ökölről.", "cut": "Az ütés lökéshullámát a játék tankig követjük.", "number": 124, "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-atvezetes-124a", "number": "124a", "section": "03 · Háború", "title": "Az ütés felébreszti a tankot", "action": "A felcsapó homok eléri a tankot. A toronyból felemelkedik a kék sárkányfej, a pink mellső lábak kibomlanak; a zöld lánctalpas test megmarad.", "camera": "Homokszintű közös kép: ököl balra, átalakuló tank jobbra.", "cut": "A felemelkedő fej mozdulatára közelebb vágunk; kinyílik a száj és elindul a tűz.", "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-28", "section": "03 · Háború", "title": "Sárkánytank", "action": "A zöld tankból kibomlott kék sárkány jobbra fordul és tüzet fúj; a katonák a hátán kapaszkodnak.", "camera": "Alulnézet a tank mellett.", "cut": "A láng útját jobbra követve megmutatjuk a célját.", "number": 125, "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-atvezetes-125a", "number": "125a", "section": "03 · Háború", "title": "A tűz átér a dombhoz", "action": "Egy képen látjuk a bal oldali sárkánytankot és a jobb oldali fogas dombot. A láng a zöld talajon végigfut, eléri a pink gyapjút; három figura menekül.", "camera": "Oldalsó nagytotál, a láng teljes útjával.", "cut": "A továbbfutó tűz mozdulatára vágunk az égő dombok közé.", "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-29", "section": "03 · Háború", "title": "Ég a domb", "action": "A tűz végigterjed a fogas dombok alján. A vörös fejű, zöld kötött figurák jobbra szaladnak.", "camera": "Tág oldalnézet az égő terepről.", "cut": "Az egyik fogas dombhoz közelítünk.", "number": 126, "width": 1600, "height": 905, "image": "kepek/kepek-06.js"}, {"id": "war-atvezetes-126a", "number": "126a", "section": "03 · Háború", "title": "A fogas domb közelről", "action": "A pink kötött domb nagy kék szeme a közeledő tűz felé fordul. Egy vörös fejű figura jobbra fut el előtte.", "camera": "Talajközeli, új oldalról felvett szörnyközeli.", "cut": "A futó figurával fordulunk el a tűztől a menekülési út felé.", "width": 1600, "height": 900, "image": "kepek/kepek-06.js"}, {"id": "war-atvezetes-126b", "number": "126b", "section": "03 · Háború", "title": "Feltűnik a menedék", "action": "A három figura mögé kerülünk. Balra az égő dombokat hagyják el, előttük a zöld terep repedező rózsaszín úttá válik. Jobbra, távol már látszik a fogas betonkapu.", "camera": "Alacsony hátsó követés, a kapu végig az útirányban marad.", "cut": "Azonos futó mozdulattal közelebb kerülünk a már megmutatott kapuhoz.", "width": 1600, "height": 905, "image": "kepek/kepek-06.js"}, {"id": "war-30", "section": "03 · Háború", "title": "Menekülés a fogas kapuhoz", "action": "Három vörös fejű, zöld kötött lény a rózsaszín, repedező tájon a betonkapu lépcsőjéhez menekül. Krém–magenta szerves növények és sötét fenyők között haladnak. Az üldözőt még nem látjuk.", "camera": "Alacsony követés a lények mögül; a távolodó kapu adja az irányt.", "cut": "A következő vágás megmutatja, ki követi őket.", "number": 127, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-31", "section": "03 · Háború", "title": "A vadászó nézőpontja", "action": "A türkiz kesztyűi között puska jelenik meg. A célzás a menekülő lényeket követi; egyikük a növény mögé húzódik, egy már a kapu lépcsőjén jár. A világ ugyanaz marad, az üldöző nézőpontjába kerültünk.", "camera": "Első személyű fegyveres nézőpont, a kapu végig tájékozódási pont.", "cut": "Egy lövés hangjára a lépcső aljához vágunk.", "number": 128, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-32", "section": "03 · Háború", "title": "A lövés elmozdítja a lépcsőt", "action": "A lövés a lépcső mellett a földbe csapódik. Rózsaszín szálak és betonpor szóródik fel; az alsó betonlapok elmozdulnak. Két lény feljebb jutott, a harmadik a levált lapon reked.", "camera": "Alacsony ferde oldalnézet közel a kapuhoz; becsapódás és lépcsőtörés egy képben.", "cut": "A por ülepedése alatt közelebb kerülünk az elakadt lényhez.", "number": 129, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-33", "section": "03 · Háború", "title": "Az utolsó lény elakad", "action": "Az utolsó lény a sérült alsó lapon marad; társai a fogas kapu alatt távolodnak. A fekete rés és a törmelék megszakítja az útját.", "camera": "Alacsony ferde közeli ugyanazon a lépcsőoldalon, a társak a háttérben.", "cut": "A társak lépéseit a fegyver felől érkező füsthang nyomja el.", "number": 130, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-34", "section": "03 · Háború", "title": "A füst elfedi a vadászatot", "action": "Visszatérünk A fegyveres nézőpontjához. Szálas szürke füst sodródik a puska és a sérült lépcső felől a kamera elé; a kapu és a lények fokozatosan eltűnnek. A teljes takarás alatt történik az életkorváltás.", "camera": "A 31-es POV ismétlése; a kép a füsttakarásig marad.", "cut": "Teljes füsttakarás után kívülről látjuk a kesztyűs kéz gazdáját.", "number": 131, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-35", "section": "03 · Háború", "title": "A a kis játékpuskával céloz", "action": "Az udvari homokozóban a fiatal felnőtt A térdel balra, és kis játékpuskával céloz a tenyérnyi vörös–zöld figurákra. A V01 tank mellette áll. Az álombeli üldözés mögött ugyanaz az erőszak van.", "camera": "A bal oldali ferde egyese; a teljes test és a kis játékok együtt rögzítik a léptéket.", "cut": "A irányító mozdulatára B eltérő célját mutató ellenbeállítás válaszol.", "number": 132, "width": 1600, "height": 900, "image": "kepek/kepek-07.js"}, {"id": "war-36", "section": "03 · Háború", "title": "B visszaillesztené a kart", "action": "B a vörös munkalapra fekteti a sérült türkiz szemüveges játékfigurát. Egyik rózsaszín kesztyűje rögzíti a testet, a másik a leszakadt kart a vállhoz illesztené. A javítás még nem sikerült.", "camera": "B jobb oldali ferde egyese, a két kéz és a két tárgydarab jól látszik.", "cut": "A játékpuskája a javítás terébe közelít.", "number": 133, "width": 1600, "height": 900, "image": "kepek/kepek-07.js"}, {"id": "war-39", "section": "03 · Háború", "title": "A megzavarja a javítást", "action": "A leengedett játékpuskája balról B vörös munkalapjának ütközik. A lap megbillen; B elkapja a testet, a még különálló csíkos kar a homokba csúszik. A nem segít: az irányítása B saját munkáját is félbeszakítja.", "camera": "Alacsony közös kézrészlet: A balról, B jobbról; arc és teljes közös kétalakos kép nincs.", "cut": "A leeső kar koppanására B visszahúzódására vágunk.", "number": 134, "width": 1600, "height": 900, "image": "kepek/kepek-07.js"}, {"id": "war-40", "section": "03 · Háború", "title": "B kivonja a figurát a játékból", "action": "B felveszi a külön kart, és a testtel együtt magához húzza. Elfordul A felőli oldaltól.", "camera": "B jobb oldali egyese; a test és a külön kar a két kezében, az üres lap előtte.", "cut": "B magához húzza a sérült figurát; ugyanannak a szemüveges fejnek és üres vállcsatlakozásnak a részletére vágunk a mohán. A helikopter rotorhangja már B utolsó képe alatt belép.", "number": 135, "width": 1600, "height": 900, "image": "kepek/kepek-07.js"}, {"id": "war-41", "section": "03 · Háború", "title": "Erdei mentési kísérlet", "action": "A sérült türkiz szemüveges figurája a belső erdő moháján fekszik. Két olívazöld egyenruhás szereplő megtámasztja a testet és a külön csíkos kart a vállhoz illeszti; a zöld és fekete köpenyes alak mellettük marad. Fölöttük ugyanaz a krém–vörös kötött helikopter lebeg, balra néző orral. A mentés és javítás még nem sikerült.", "camera": "41A: az eredeti erdei képhez közeli totál. 41B: alacsony ferde félközeli a testre és a külön karra; a négy segítő és a helikopter együtt azonosítható.", "cut": "A visszaillesztés kísérletének pillanatában a vállnyílásból beton kezd nőni: a 42 ugyanazt a testet és külön kart követi.", "number": 136, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-42", "section": "03 · Háború", "title": "A vállból beton nő", "action": "A csíkos kar visszaillesztésekor a sérült figura üres vállnyílásából szürke betonlépcső nő ki. A szemüveges fej és a megmaradt kar látható; a levált kar továbbra is a mentő kezében marad. A javítás váratlanul egy új világot indít el.", "camera": "Ferde közeli a vállnyílásra; a beton és a test érintkezése a kép központja.", "cut": "A beton növekedését követve tágítunk a négy segítőre és a helikopterre.", "number": 137, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-43", "section": "03 · Háború", "title": "A mentés helyén város emelkedik", "action": "A vállból induló lépcső szabálytalan betontömbbé és türkiz–vörös miniatűr várossá nő. Kiszorítja és fokozatosan eltakarja a négy segítőt. A sérült szemüveges fej a tömb tövénél; fent ugyanaz a helikopter marad.", "camera": "Erdei totál; a növekvő tömb, a négy eredeti csuklya és a helikopter olvasható.", "cut": "A kamera a türkiz épület egyik nyílása felé közelít; a beton takarásából a városi utca azonos anyaga tárul fel. A léptékváltás teljes mozgása még hátravan.", "number": 138, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-44", "section": "03 · Háború", "title": "Ellenség a gerenda alatt", "action": "Belépünk a kiemelkedett városba. Széles szürke utca, lépcsőzetes beton, kopott türkiz–vörös házak, magas lakótömbök és vezetékek. Távol robbanás és fekete füst. A vörös fejű, zöld kötött lény megtalálja A bézs ruhás, fekete arcú katonáját egy lehullott betongerenda alatt. A piros busz elzárja a mentőautó útját.", "camera": "Alacsony ferde utcatotál: elöl a sérült, középen a busz és a mentő útvonala.", "cut": "A lény a sérültről a torlaszoló buszra fordul; azonos utca és térbeli támpontok maradnak.", "number": 139, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-45", "section": "03 · Háború", "title": "Szabaddá teszi az utat", "action": "A vörös fejű lény két kézzel jobbra tolja a piros játékbuszt. A piros mentőautó mögötte vár. A lépcsős tér nagyobb, fekete ruhás, türkiz nadrágos maszkos mentőfigurája a gerendához nyúl; az autó hozzáférését még a busz akadályozza. A bézs katona a gerenda alatt marad.", "camera": "A 44 azonos oldala és magassága; a busz jobbra mozdulása jól követhető.", "cut": "Jobbra kikerül a busz, balra előregurul a mentő. A következő képben a gerenda felemelése zárja le a mentést.", "number": 140, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-46", "section": "03 · Háború", "title": "Kimenti az ellenfelet", "action": "A busz az utca jobb szélére kerül, a mentőautó közel ér. A nagy maszkos mentő felemeli a betongerendát. A vörös fejű lény kihúzza a bézs katonát, aki a lépcső tövén ül, minden végtagja szabadon. A segítség sikerül; nincs győzelmi gesztus. A városban a háttér tüze tovább él.", "camera": "Közelebbi alacsony háromalakos kép; a szabad lábak, az eltartott gerenda és a félretolt busz együtt láthatók.", "cut": "A kiszabadított katona szabad lábairól vágunk az udvari tank lánctalpára. A belső akadály elhárul, de odakint a közös talaj épp szétszakad.", "number": 141, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-47", "section": "03 · Háború", "title": "A közös talaj szakad", "action": "A tovább tolja a zöld lánctalpas tankot; a lánctalp felszakítja a textiltalajt. B igyekszik meggátolni a szakadást. A nyomása tovább tágítja a nyílást, az elem megdől.", "camera": "Alacsony közös kézrészlet, A türkiz keze balra, B rózsaszín kezei jobbra; teljes közös játékoskép nincs.", "cut": "A szálak szakadásának hangja egyetlen vágással kiesik a 48 hétköznapi képén.", "number": 142, "width": 1600, "height": 900, "image": "kepek/kepek-07.js"}, {"id": "war-48", "section": "03 · Háború", "title": "Bevillanás", "action": "Hétköznapi, üres játszótéri homokozó nedves valódi homokkal; egy zöld műanyag katona félig betemetve.", "camera": "Rögzített talajközeli fotós kompozíció.", "cut": "Visszatérünk a szakadás ugyanazon oldalára, kopottabb A-val.", "number": 143, "width": 1600, "height": 900, "image": "kepek/kepek-07.js"}, {"id": "war-49", "section": "03 · Háború", "title": "Elveszti az irányítást", "action": "A keze már nem ér a tankhoz. A gép orra a textiltalaj fekete repedése fölé kerül, a lánctalp magával húzza a szálakat. B képen kívül marad. A kopott, görnyedt A nem tudja visszafogni a korábban tovább erőltetett gépet. Ez az utolsó udvari kép a záróblokk előtt.", "camera": "A 47 kameraoldaláról alacsony tágítás A teljes tartására; A balra, a tank jobbra.", "cut": "A kamera a tankkal a repedés felé süllyed. Az 50-ben már a belső világban vagyunk, játékoskéz nélkül.", "number": 144, "width": 1600, "height": 900, "image": "kepek/kepek-07.js"}, {"id": "war-50", "section": "03 · Háború", "title": "A két belső világ szétszakad", "action": "A tank a repedésen át a belső világ szürke partjára jut. Balra a korábban látott betonváros és türkiz–vörös házak, jobbra a rózsaszín táj krém–magenta növényei és sötét fenyői. Egy összefüggő fekete hasadék választja szét őket. A köztük feszülő anyagszálak sorban elszakadnak.", "camera": "50A: alacsony belső totál a szétszakadt partokra. 50B: a kamera átbillen és lefelé süllyed; az 51-re vízszintig ér.", "cut": "A kamera átbillen a szakadás peremén, leereszkedik a krém és rózsaszín textilszálak között. Lent előbb türkiz visszfény, majd egy lehulló betondarab csobbanása jelzi a vizet. A kamera vízszintig süllyed, a szálak eltűnnek az előtérből; az 51-ben kinyílik a tenger.", "number": 145, "width": 1600, "height": 905, "image": "kepek/kepek-07.js"}, {"id": "war-atvezetes-145a", "number": "145a", "section": "03 · Háború", "title": "A hasadékba zuhanunk", "action": "A talaj szétszakad, a kamera lefelé billen a fekete hasadékba. Fölöttünk a tank a peremen marad, mellettünk szálak szakadnak el.", "camera": "Lefelé forduló, zuhanó POV a két világ fala között.", "cut": "A sötét mélység felé folytatódik a zuhanás.", "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-atvezetes-145b", "number": "145b", "section": "03 · Háború", "title": "Alattunk feltűnik a tenger", "action": "A fekete hasadék mélyén türkiz fény nyílik. Lefelé nézve meglátjuk a távoli vizet és a kis fekete hajót; a szürke és rózsaszín falak távolodnak.", "camera": "Meredeken lefelé néző POV, erős mélységgel.", "cut": "A vízfelszín közeledik; vízszintbe fordulva érkezünk a hajó jelenetébe.", "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-51", "section": "03 · Háború", "title": "Egy hajó, egy lebegő test", "action": "A szakadék sötétjéből egy nyitott türkiz tenger tárul fel. Egy fekete hajótestű, vörös kéményes hajó halad jobbra. Előtte egyetlen rétegzett fekete–krém–vörös–türkiz textiltest lebeg. Nagy üres vízfelület választja el őket.", "camera": "Alacsony ferde vízszinti totál.", "cut": "A hajó közelítésével a lebegő test lassan süllyedni kezd.", "number": 146, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-52", "section": "03 · Háború", "title": "A test leér a vízhez", "action": "Az egyetlen rétegzett textiltest leér a vízhez a hajó előtt. Körülötte kis hullámgyűrű nyílik, eléri a hajó orrát; a hajó lassítani kezd. A nyitott tengeren ugyanaz a két elem marad, új motívum nélkül.", "camera": "Alacsony vízszinti, közelebbi oldalnézet; a hajó balra, az akadály jobbra, a hajó iránya továbbra is jobbra.", "cut": "A hullámgyűrű alatt víz alá merülünk; az 54-ben ugyanazt a bombát követjük.", "number": 147, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-54", "section": "03 · Háború", "title": "A bomba alá merülünk", "action": "A rétegzett textilbomba a hajó előtt víz alá süllyed. Követjük; a hajó alja és a felszíni fény egy ideig fent marad. A hang tompa víz alatti térre vált.", "camera": "Víz alatti alulnézet, a bomba mellett süllyedő kamera.", "cut": "A bomba árnyékából a fogmintás torpedó mozgására vágunk.", "number": 148, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-55", "section": "03 · Háború", "title": "A tank mintája torpedón él tovább", "action": "A tankreferencia fekete–krém fogmintája és türkiz teste hosszú torpedóként halad át a gyökerek között. Ez képi rokon, nem a felszíni bomba új alakja; a későbbi indítás előtt azonosítjuk.", "camera": "Tiszta oldalprofil; az új mentési tengelyen a torpedó majd balra indul.", "cut": "A torpedó közelében megpillantjuk a búvárokat.", "number": 149, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-56", "section": "03 · Háború", "title": "A búvárok kijáratot keresnek", "action": "Három, rózsaszín, fekete és vörös kötött ruhás, krém gázmaszkos fegyveres búvár a gyökerek közé szorult. A rózsaszín elenged egy kémhalat: az a világosabb víz felé úszik. A cél most a kijutás.", "camera": "Alacsony ferde csoportkép; a hal elengedésére kézközeli betét szükséges.", "cut": "A hal irányában a király szigonya vágja el az utat.", "number": 150, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-57", "section": "03 · Háború", "title": "A király elzárja az utat", "action": "A rózsaszín csuklyás, kőmaszkos tengeri király szigonyával hadonászik, és a gyökérfolyosó felé tereli vissza a menekülőket. Még fenyegetésként látjuk; a szörny később őt is megtámadja.", "camera": "Ferde félközeli a királyra; a szigony mozdulatát a halak útjára illesztjük.", "cut": "A halraj a szigony alatt keskeny rést talál.", "number": 151, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-58", "section": "03 · Háború", "title": "A halak megtalálják a rést", "action": "A halak átúsznak a gyökerek közötti keskeny résen, és felfelé fordulnak. A búvárok követhető menekülési útvonalat kapnak.", "camera": "Oldalról követés, majd enyhe felfelé billenés.", "cut": "A halak mögött felkavarodó víz a közeledő szörnyet jelzi.", "number": 152, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-59", "section": "03 · Háború", "title": "A szörny mindenkit üldöz", "action": "A hosszú végtagú türkiz szörny hatalmas fogas szájjal ront a búvárok és a király felé. Közös veszély keletkezik: egyik fél sem tud egyszerűen továbbmenni.", "camera": "Oldalnézet; a szörny balról támad, a kijárat jobbra-fent.", "cut": "A menekülés közben a rózsaszín búvár lába fennakad.", "number": 153, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-60", "section": "03 · Háború", "title": "Visszafordulnak a társukért", "action": "A rózsaszín búvár bokája a gyökerek közé akad. A vörös már menekülne, de visszafordul és megfogja a csuklóját. A fekete a torpedót balra, a szörny felé indítja, hogy időt nyerjen. A vörös húzza ki a társát.", "camera": "Olvasható oldaltotál. Két rövid betét kell: fennakadt boka, majd a visszaforduló kéz.", "cut": "A torpedó útját követő vágással a szörny szájához érünk.", "number": 154, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-61", "section": "03 · Háború", "title": "Az ellenfél segít", "action": "A szörny a torpedóra kap rá, majd a királyt is elnyelné. A király a szigonyával kitámasztja a száját. A korábbi akadály most időt ad a mentésnek; nem robbanással győznek.", "camera": "Közelibb oldalnézet, a szigony–fog–torpedó érintkezése olvasható.", "cut": "Mikor a búvárok kiszabadulnak, a király elengedi a beszorult szigonyt és utánuk indul. Ehhez még kell egy kimenekülési betét.", "number": 155, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-62", "section": "03 · Háború", "title": "Együtt a felszín felé", "action": "A vörös tovább fogja a kimerült rózsaszín csuklóját, a fekete fedezi őket. A kémhalraj a kicsi világos felszíni nyíláshoz vezeti a csoportot. A király menekülését rövid hátratekintő betét zárja le; ez a kép még hiányzik.", "camera": "Hátulról alulnézet, erős jobbra-felfelé irány.", "cut": "A fényes víznyíláson át a kamera emelkedik tovább; a buborék hangja folytonos.", "number": 156, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-63", "section": "03 · Háború", "title": "A tenger egy pocsolyában", "action": "A kamera áttöri a felszínt. Az óriási vízi tér a játszótér apró pocsolyájának bizonyul. A két vörös–zöld hal még alatta látszik; mögötte már a brutalista homokvár áll.", "camera": "Vízvonalat metsző talajközeli kép; onnan lassú emelkedés.", "cut": "Az emelkedés és tágítás feltárja a teljes várat.", "number": 157, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-64", "section": "03 · Háború", "title": "A homokozó helyén homokvár", "action": "A régi udvar ugyanott maradt, de a homokozó helyén érdes, utopista brutalista homokvár áll: lépcsőzetes tömegek, konzol és mély nyílások. A pocsolyából nedves nyom vezet a bejáratához.", "camera": "Rögzített ferde totál, majd közelítés a mély bejáratra.", "cut": "A nyílás sötétje összeköti a kinti várat a belső sakkhelyszínnel.", "number": 158, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-65", "section": "03 · Háború", "title": "Az idősebb admirálisok", "action": "A kamera a homokvár bejáratán át feltárja a két idősebb játékost. A balra, B jobbra ül admirálisi ruhában, a zárt rostély megmarad. Már sakkoznak.", "camera": "65A: bejáratból tág közös. 65B: közelebbi közös a táblával, azonos oldalról.", "cut": "A békésnek tűnő sakk kézközeli csalásba vált.", "number": 159, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-66", "section": "03 · Háború", "title": "A csalás visszatér", "action": "A bal kezében tart egy világos lovat, a másik kezével közben félretol egy fekete gyalogot. B elkapja a csuklóját. Ugyanaz a tiltott közvetlen beavatkozás tér vissza, mint a golyónál; az idősebb szereplők sem változtak meg.", "camera": "Ferde felső táblaközeli; az ellenfél csuklófogása és az elmozdított gyalog együtt.", "cut": "B keze nem enged el: a visszalökés mozdulatán vágunk a tábla magasságára.", "number": 160, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-67", "section": "03 · Háború", "title": "A sakkból dulakodás lesz", "action": "A tenyérrel nyomja B fekete figuráit, B visszatolja A világos figuráit. Egy bástya legurul a tábláról. Nincs nagy verekedés: apró, makacs erőszak, a rend fokozatos szétverése.", "camera": "Nagyon alacsony oldalközeli a sakkmezők magasságában; a figurák kerülnek előtérbe.", "cut": "A bástya koppanása után kintről idegen zaj érkezik.", "number": 161, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-68", "section": "03 · Háború", "title": "Zaj kintről", "action": "A táblán megállnak a kezek. Kintről kerékcsapágy-zörgés és gyorsan közeledő hangok hallatszanak; először B, majd A fordul az ablak felé. A forrást még nem mutatjuk.", "camera": "Azonos oldali közös félközeli, a jobb oldali ablak iránya rögzített.", "cut": "Az utolsó fejfordulásból felállás és elindulás lesz.", "number": 162, "width": 1600, "height": 905, "image": "kepek/kepek-08.js"}, {"id": "war-69", "section": "03 · Háború", "title": "Verseny az ablakig", "action": "A két admirális feláll és a jobb oldali ablakhoz siet. A rózsaszín ér oda előbb, a kék a vállánál keresztbe lép. A félbehagyott sakkasztal balra marad.", "camera": "Tág oldalnézet, asztal, teljes alakok és ablak egy képen.", "cut": "A vállak ütközésére közelítünk az ablaknál.", "number": 163, "image": "kepek/kepek-08.js", "width": 1600, "height": 905}, {"id": "war-70", "section": "03 · Háború", "title": "Egymást ellökve néznek ki", "action": "A B vállát félretolja, B visszanyomja A könyökét, hogy a keskeny ablakhoz férjen. A sakkbeli tolakodás ugyanazzal a gesztussal folytatódik. Bent marad a kamera, kint csak fény látszik.", "camera": "Belső félközeli, szűk ablakkeret, két egymásnak feszülő test.", "cut": "A nyomó kéz még a vállon marad, de a kinti látványtól egyszerre megállnak.", "number": 164, "width": 1600, "height": 905, "image": "kepek/kepek-09.js"}, {"id": "war-71", "section": "03 · Háború", "title": "Meglátnak valamit", "action": "Az ablaknál összepréselődve hirtelen megmerevednek. A bicikliseket látják, de a néző még nem: nincs külső ellenbeállítás. A zaj folytonosan átvezet a valódi gyerekkori nézőpontba.", "camera": "Szűk belső profilkettős; a külső világ képen kívül marad.", "cut": "Hanghíd és a homokszemek anyagillesztése a valódi homokozó kerete alá.", "number": 165, "width": 1600, "height": 905, "image": "kepek/kepek-09.js"}, {"id": "war-72", "section": "04 · Biciklis játszótér", "title": "Vissza az eredeti búvóhelyre", "action": "Ugyanazon a homokozóperem alatti helyen vagyunk. Kint az ismert játszótér látszik, még egy pillanatig csendes.", "camera": "Gye
